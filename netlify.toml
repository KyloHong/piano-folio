[build]
  command = "npm install"
  publish = "."  # 静态文件在根目录（index.html）
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# 使用 Turso 版本的 API（api-turso.js）
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api-turso/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
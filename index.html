<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>钢琴曲目练习 - 和弦标记工具</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Playfair+Display:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #F9F9F7;
            --bg-secondary: #EFEFE9;
            --bg-card: #FFFFFF;
            --bg-hover: #EAE8E2;
            --accent-gold: #000000;
            --accent-gold-dim: #444444;
            --accent-rose: #c06070;
            --accent-sage: #6a8a78;
            --text-primary: #111111;
            --text-secondary: #666666;
            --text-dim: #9a9690;
            --border-subtle: rgba(0, 0, 0, 0.10);
            --shadow-glow: 0 2px 12px rgba(0, 0, 0, 0.04);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Serif SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.7;
            overflow-x: hidden;
            padding-top: 52px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 24px 120px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 48px;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: 600;
            color: var(--accent-gold);
            letter-spacing: 0.08em;
            margin-bottom: 8px;
        }

        .tagline {
            font-size: 0.9rem;
            color: var(--text-secondary);
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        /* Search Section */
        .search-section {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 2px;
            padding: 36px;
            margin-bottom: 32px;
            box-shadow: var(--shadow-glow);
        }

        .search-row {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .search-input {
            flex: 1;
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: 2px;
            padding: 12px 18px;
            font-size: 0.95rem;
            color: var(--text-primary);
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            border-color: var(--text-primary);
        }

        .search-input:focus-visible {
            outline: 2px solid var(--text-primary);
            outline-offset: 2px;
        }

        .search-input::placeholder {
            color: var(--text-dim);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 2px;
            font-size: 0.9rem;
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:focus-visible {
            outline: 2px solid var(--text-primary);
            outline-offset: 2px;
        }

        .btn-primary {
            background: var(--text-primary);
            color: var(--bg-primary);
        }

        .btn-primary:hover {
            background: var(--text-secondary);
        }

        .btn-danger {
            background: var(--accent-rose);
            color: #fff;
        }

        .btn-danger:hover {
            background: #a05060;
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-subtle);
        }

        .btn-secondary:hover {
            background: var(--bg-hover);
            border-color: var(--text-secondary);
            color: var(--text-primary);
        }

        /* Key Selector */
        .key-selector {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .key-label {
            font-size: 0.72rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .key-select {
            padding: 6px 10px;
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: 2px;
            color: var(--text-primary);
            font-size: 0.72rem;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            outline: none;
        }

        .key-select:hover {
            border-color: var(--text-secondary);
        }

        .key-select:focus {
            border-color: var(--text-primary);
        }

        /* Auto Scroll Control */
        .auto-scroll-control {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .auto-scroll-btn {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: 2px;
            color: var(--text-secondary);
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.15s ease;
            padding: 0;
            line-height: 1;
        }

        .auto-scroll-btn:hover {
            border-color: var(--text-secondary);
            color: var(--text-primary);
        }

        .auto-scroll-btn.active {
            background: var(--text-primary);
            color: var(--bg-primary);
            border-color: var(--text-primary);
        }

        .auto-scroll-speed {
            padding: 6px 8px;
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: 2px;
            color: var(--text-primary);
            font-size: 0.72rem;
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            outline: none;
        }

        .auto-scroll-speed:hover {
            border-color: var(--text-secondary);
        }

        .auto-scroll-speed:focus {
            border-color: var(--text-primary);
        }

        /* Mode Toggle */
        .mode-toggle {
            display: inline-flex;
            border: 1px solid var(--border-subtle);
            border-radius: 2px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .mode-btn {
            padding: 6px 18px;
            background: transparent;
            border: none;
            border-left: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            font-size: 0.72rem;
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        .mode-btn:first-child {
            border-left: none;
        }

        .mode-btn.active {
            background: var(--text-primary);
            color: #fff;
            border-color: var(--text-primary);
        }

        .mode-btn:hover:not(.active) {
            color: var(--text-primary);
            background: rgba(0,0,0,0.04);
        }

        .mode-btn:focus-visible {
            outline: 2px solid var(--text-primary);
            outline-offset: -2px;
            z-index: 1;
        }

        /* 详情只读视图隐藏搜索栏 */
        #homeSearchSection.readonly-hidden {
            display: none;
        }

        /* Song Info */
        /* Editor Top Action Bar */
        .editor-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
        }

        /* Song Info Hero */
        .song-info {
            text-align: center;
            padding: 32px 24px 40px;
            margin-bottom: 32px;
        }

        .song-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.4rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 12px;
            line-height: 1.2;
            letter-spacing: -0.5px;
            text-wrap: balance;
        }

        .song-title-container {
            margin-bottom: 12px;
        }

        .song-title-input {
            width: 100%;
            max-width: 500px;
            font-family: 'Playfair Display', serif;
            font-size: 2.4rem;
            font-weight: 700;
            color: var(--text-primary);
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            text-align: center;
            padding: 8px 16px;
            margin-bottom: 12px;
            line-height: 1.2;
            letter-spacing: -0.5px;
            transition: border-color 0.2s;
        }

        .song-title-input::placeholder {
            color: var(--text-dim);
            font-weight: 400;
        }

        .song-title-input:focus {
            outline: none;
            border-bottom-color: var(--accent-color);
        }

        .song-title-input[readonly] {
            cursor: default;
            border-bottom-color: transparent;
        }

        .song-meta {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .song-artist-input {
            font-size: 1.1rem;
            color: var(--text-secondary);
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            text-align: center;
            padding: 4px 12px;
            font-style: italic;
            transition: border-color 0.2s;
        }

        .song-artist-input::placeholder {
            color: var(--text-dim);
        }

        .song-artist-input:focus {
            outline: none;
            border-bottom-color: var(--accent-color);
        }

        .song-artist-input[readonly] {
            cursor: default;
            border-bottom-color: transparent;
        }

        .song-author {
            font-size: 0.9rem;
            color: var(--text-dim);
            margin-left: 8px;
        }

        .song-artist {
            color: var(--text-secondary);
            font-size: 0.95rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 500;
        }

        .song-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-top: 28px;
        }

        .song-divider::before,
        .song-divider::after {
            content: '';
            width: 48px;
            height: 1px;
            background: var(--border-subtle);
        }

        .song-divider::before {
            content: '';
        }

        .song-divider::after {
            content: '';
        }

        /* Lyrics Section */
        .lyrics-section {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 2px;
            padding: 36px;
            margin-bottom: 32px;
        }

        .section-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            gap: 16px;
        }

        .lyrics-header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        /* ========== AI 智能和弦按钮样式 ========== */
        .ai-chord-analyzer {
            position: relative;
        }

        /* 黑白线框风格按钮 */
        .ai-chord-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 7px 18px;
            background: transparent;
            border: 1px solid var(--text-primary);
            border-radius: 2px;
            color: var(--text-primary);
            font-size: 0.72rem;
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        .ai-chord-btn:hover {
            background: var(--text-primary);
            color: #fff;
        }

        .ai-chord-btn:active {
            opacity: 0.85;
        }

        .ai-btn-icon {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
        }

        .ai-btn-text {
            white-space: nowrap;
        }

        /* Loading 状态 */
        .ai-chord-btn.loading {
            pointer-events: none;
            opacity: 0.6;
        }

        .ai-chord-btn.loading .ai-btn-icon {
            animation: ai-spin 1s linear infinite;
        }

        @keyframes ai-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 提示文字 */
        .ai-analyze-tip {
            text-align: center;
            font-size: 0.68rem;
            color: var(--text-dim);
            margin-top: 4px;
            opacity: 0.8;
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.15rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-subtle);
            margin-left: 16px;
        }

        /* Lyric Line */
        .lyric-line {
            display: flex;
            align-items: flex-end;
            padding: 10px 18px;
            margin: 6px 0;
            border-radius: 2px;
            transition: background 0.2s ease;
            cursor: pointer;
            min-height: 48px;
        }

        .lyric-line:hover {
            background: var(--bg-hover);
        }

        .lyric-line.active {
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
        }

        .lyric-line.is-readonly {
            cursor: default;
        }

        .lyric-line.is-readonly:hover {
            background: transparent;
        }

        .line-number {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-dim);
            width: 28px;
            padding: 24px 0 2px;
            line-height: 1.2;
            user-select: none;
        }

        .line-content {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            align-items: center;
        }

        .line-content.editable {
            outline: none;
            min-height: 32px;
        }

        .line-content.editable:focus {
            outline: 1px solid var(--text-secondary);
            outline-offset: 4px;
            border-radius: 2px;
        }

        /* Lyric Character with Chord */
        .lyric-char {
            position: relative;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding: 24px 2px 2px;
            border-radius: 2px;
            cursor: pointer;
            transition: background 0.15s ease;
            min-height: 32px;
            box-sizing: border-box;
        }

        .lyric-char:hover {
            background: rgba(0, 0, 0, 0.04);
        }

        .lyric-char.readonly {
            cursor: default;
        }

        .lyric-char.readonly:hover {
            background: transparent;
        }

        .char-text {
            font-size: 1.1rem;
            color: var(--text-primary);
            line-height: 1.2;
            border-bottom: 1px solid transparent;
            transition: border-color 0.15s ease;
        }

        .lyric-char.has-chord .char-text {
            border-bottom-color: var(--text-primary);
        }

        .char-chord {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            display: inline-flex;
            align-items: baseline;
            gap: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-primary);
            white-space: nowrap;
            line-height: 1.3;
            pointer-events: none;
            font-weight: 600;
        }

        .char-chord:empty {
            display: none;
        }

        .char-chord .fc-chord { color: var(--text-primary); font-weight: 600; }
        .char-chord .fc-tab   { color: var(--text-dim); }

        /* Chord Slot (pre/post position) */
        .chord-slot {
            position: relative;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding: 24px 2px 2px;
            margin: 0 1px;
            border-radius: 2px;
            cursor: pointer;
            transition: background 0.15s ease;
            min-height: 32px;
            box-sizing: border-box;
            border-bottom: 1px solid transparent;
        }

        .chord-slot:hover {
            background: rgba(0, 0, 0, 0.04);
        }

        .chord-slot.has-chord {
            border-bottom-color: var(--text-primary);
        }

        .slot-chord {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            display: inline-flex;
            align-items: baseline;
            gap: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-primary);
            white-space: nowrap;
            line-height: 1.3;
            pointer-events: none;
            font-weight: 600;
        }

        .slot-chord:empty {
            display: none;
        }

        .slot-chord .fc-chord { color: var(--text-primary); font-weight: 600; }
        .slot-chord .fc-tab   { color: var(--text-dim); }

        .slot-text {
            font-size: 1.1rem;
            color: var(--text-dim);
            line-height: 1.2;
        }

        /* Position indicator dot on chord-slot */
        .chord-slot::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 3px;
            height: 3px;
            background: var(--text-dim);
            border-radius: 50%;
            opacity: 0.3;
            pointer-events: none;
        }

        .chord-slot.has-chord::before {
            display: none;
        }

        /* Position Selector */
        .position-selector {
            display: flex;
            gap: 4px;
            margin: 12px 0;
            padding: 4px;
            background: var(--bg-primary);
            border-radius: 2px;
            border: 1px solid var(--border-subtle);
        }

        .pos-btn {
            flex: 1;
            padding: 7px 4px;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 2px;
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .pos-btn:hover {
            color: var(--text-primary);
            background: var(--bg-hover);
        }

        .pos-btn.active {
            background: var(--text-primary);
            color: var(--bg-primary);
            font-weight: 500;
        }

        /* --- Chord Builder Panel --- */
        .chord-panel {
            position: fixed;
            z-index: 1000;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 2px;
            padding: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            display: none;
            width: 300px;
        }

        .chord-panel.visible {
            display: block;
            animation: panelIn 0.15s ease;
        }

        @keyframes panelIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .panel-title {
            font-size: 0.78rem;
            color: var(--text-primary);
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .panel-close {
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 1rem;
            padding: 2px 6px;
            line-height: 1;
        }

        .panel-close:hover { color: var(--text-primary); }

        /* Compact rows */
        .chord-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .chord-label {
            font-size: 0.7rem;
            color: var(--text-dim);
            min-width: 36px;
            flex-shrink: 0;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .chord-btn-group {
            display: flex;
            gap: 3px;
            flex-wrap: wrap;
            flex: 1;
        }

        .chord-btn {
            padding: 5px 8px;
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: 2px;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.12s ease;
            min-width: 22px;
            text-align: center;
        }

        .chord-btn:hover {
            background: var(--bg-hover);
            border-color: var(--text-secondary);
        }

        .chord-btn.selected {
            background: var(--text-primary);
            color: var(--bg-primary);
            border-color: var(--text-primary);
            font-weight: 500;
        }

        .chord-btn.sharp, .chord-btn.flat { background: var(--bg-primary); }

        /* Slash chord group */
        .slash-chord-group {
            display: flex;
            gap: 3px;
            flex-wrap: wrap;
            flex: 1;
        }

        .slash-btn {
            padding: 4px 8px;
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: 2px;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.12s ease;
        }

        .slash-btn:hover {
            border-color: var(--text-secondary);
            color: var(--text-primary);
        }

        .slash-btn.selected {
            background: var(--accent-sage);
            color: var(--bg-primary);
            border-color: var(--accent-sage);
        }

        /* Chord name preview */
        .chord-preview-name {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            color: var(--text-primary);
            text-align: center;
            margin: 12px 0 10px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Editable tab row */
        .chord-tab-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 10px;
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: 2px;
            padding: 8px;
        }

        .tab-item {
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 1 1 0;
            min-width: 0;
        }

        .tab-label {
            font-size: 0.65rem;
            color: var(--text-dim);
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .tab-input {
            flex: 1;
            max-width: 80px;
            background: transparent;
            border: none;
            border-bottom: 1px dashed var(--border-subtle);
            padding: 2px 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-primary);
            text-align: center;
            outline: none;
            min-width: 0;
        }

        .tab-input:focus {
            border-bottom-color: var(--text-primary);
            background: var(--bg-hover);
        }

        .tab-input.edited {
            color: var(--text-primary);
            border-bottom-style: solid;
            border-bottom-color: var(--text-primary);
        }

        .tab-reset {
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 0.85rem;
            padding: 2px 6px;
            border-radius: 2px;
            line-height: 1;
        }

        .tab-reset:hover {
            color: var(--text-primary);
            background: var(--bg-hover);
        }

        .tab-inversion {
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 2px;
            line-height: 1;
            font-family: 'JetBrains Mono', monospace;
            transition: all 0.12s ease;
            min-width: 38px;
        }

        .tab-inversion:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
            border-color: var(--text-secondary);
        }

        .chord-actions {
            display: flex;
            gap: 6px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border-subtle);
        }

        .chord-actions .btn {
            flex: 1;
            justify-content: center;
            padding: 7px;
            font-size: 0.78rem;
        }

        /* Old legacy classes - kept to avoid breaking */
        .chord-builder { padding: 0; }
        .chord-presets,
        .chord-section,
        .chord-section-label,
        .chord-preview,
        .chord-preview-tab,
        .chord-delete,
        .chord-input-group,
        .chord-input,
        .chord-extended,
        .ext-label,
        .ext-row,
        .ext-input { display: none; }

        /* Section Tag */
        .section-tag {
            position: absolute;
            left: -6px;
            bottom: 2px;
            background: var(--text-primary);
            color: var(--bg-primary);
            font-size: 0.62rem;
            padding: 4px 10px;
            border-radius: 2px;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .lyric-line {
            position: relative;
        }

        /* Section Selector Dropdown */
        .line-actions {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            gap: 8px;
            align-items: center;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .lyric-line:hover .line-actions {
            opacity: 1;
        }

        /* When a section dropdown is open, force line-actions visible and on top */
        .line-actions.section-dropdown-active {
            opacity: 1 !important;
            z-index: 10000;
        }

        /* Ensure the entire lyric line is on top when dropdown is open (Safari stacking context fix) */
        .lyric-line.line-with-active-dropdown {
            z-index: 10000;
        }

        .section-selector {
            position: relative;
            transform: none;
            opacity: 1;
            transition: none;
        }

        .section-btn {
            padding: 6px 12px;
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: 2px;
            color: var(--text-secondary);
            font-size: 0.72rem;
            cursor: pointer;
            letter-spacing: 0.3px;
            transition: all 0.2s ease;
        }

        .section-btn:hover {
            border-color: var(--text-secondary);
            color: var(--text-primary);
        }

        /* Section label displayed above lyric line */
        .line-section-label {
            font-size: 0.82rem;
            color: #7d6a3d;
            font-weight: 500;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            margin-top: 20px;
            padding-left: 0;
            border-left: none;
            text-align: left;
            display: block;
            line-height: 1.4;
        }

        /* First section label shouldn't have extra top margin */
        #lyricsContainer > .line-section-label:first-child {
            margin-top: 0;
        }

        /* Section dropdown */
        .section-dropdown {
            position: absolute;
            right: 0;
            top: calc(100% + 4px);
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 2px;
            padding: 4px;
            z-index: 10000;
            min-width: 120px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        .section-dropdown-btn {
            display: block;
            width: 100%;
            padding: 8px 12px;
            background: transparent;
            border: none;
            border-radius: 2px;
            color: var(--text-secondary);
            font-size: 0.82rem;
            cursor: pointer;
            text-align: left;
            transition: all 0.15s ease;
            margin-bottom: 2px;
            font-family: inherit;
        }

        .section-dropdown-btn:last-child {
            margin-bottom: 0;
        }

        .section-dropdown-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .section-dropdown-btn.section-clear {
            color: #9a9690;
            font-size: 0.78rem;
        }

        .section-dropdown-btn.section-clear:hover {
            color: #c06070;
        }

        .line-edit-btn {
            padding: 6px 12px;
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: 2px;
            color: var(--text-secondary);
            font-size: 0.72rem;
            cursor: pointer;
            letter-spacing: 0.3px;
            transition: border-color 0.2s, color 0.2s, background 0.2s;
        }

        .line-edit-btn:hover {
            border-color: var(--text-secondary);
            color: var(--text-primary);
            background: var(--bg-hover);
        }

        .line-delete-btn {
            padding: 6px 12px;
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: 2px;
            color: var(--text-secondary);
            font-size: 0.72rem;
            cursor: pointer;
            letter-spacing: 0.3px;
            transition: border-color 0.2s, color 0.2s, background 0.2s;
        }

        .line-delete-btn:hover {
            border-color: var(--accent-rose);
            color: var(--accent-rose);
            background: var(--bg-hover);
        }

        .line-delete-inline-btn {
            width: 36px;
            min-height: 36px;
            border: 1px solid var(--border-subtle);
            background: var(--bg-primary);
            border-radius: 4px;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            flex-shrink: 0;
            color: #9a9690;
            padding: 0;
            align-self: stretch;
            line-height: 1;
        }

        .line-delete-inline-btn svg {
            color: currentColor;
            transition: color 0.15s ease;
        }

        .line-delete-inline-btn:hover {
            border-color: #c06070;
            color: #c06070;
            background: rgba(192, 96, 112, 0.08);
        }

        .line-delete-inline-btn:active {
            background: rgba(192, 96, 112, 0.15);
        }

        .lyric-edit-container {
            display: flex;
            align-items: stretch;
            gap: 8px;
            width: 100%;
            position: relative;
            z-index: 500;
        }

        .lyric-edit-input {
            flex: 1;
            padding: 8px 12px;
            background: var(--bg-primary);
            border: 1px solid var(--text-primary);
            border-radius: 2px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            min-width: 200px;
        }

        /* Chord Summary Panel */
        .chord-summary {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 2px;
            padding: 36px;
            margin-top: 32px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
        }

        .summary-item {
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: 2px;
            padding: 16px 12px;
            text-align: center;
            transition: all 0.2s ease;
        }

        .summary-item:hover {
            border-color: var(--text-primary);
        }

        .summary-chord {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            color: var(--text-primary);
            margin-bottom: 4px;
            font-weight: 600;
        }

        .summary-count {
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        /* Section Progression */
        .summary-progressions {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .progression-block {
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: 2px;
            padding: 16px 18px;
        }
        .progression-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .progression-section-name {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
            padding: 3px 10px;
            background: var(--bg-secondary);
            border-radius: 2px;
        }
        .progression-loop-badge {
            font-size: 0.72rem;
            color: var(--accent-color, #7d6a3d);
            background: var(--bg-secondary);
            padding: 3px 8px;
            border-radius: 2px;
        }
        .progression-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        .progression-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 2px;
            padding: 10px 12px 8px;
            text-align: center;
            min-width: 88px;
        }
        .progression-chord {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-primary);
            margin-bottom: 6px;
        }
        .progression-arrow {
            font-size: 1rem;
            color: var(--text-dim);
            opacity: 0.55;
        }

        /* Mini Piano Keyboard */
        .mini-piano {
            display: flex;
            gap: 1px;
            justify-content: center;
            position: relative;
            width: 84px;
            height: 28px;
            margin: 0 auto;
        }
        .mini-key {
            flex: 1;
            background: #fff;
            border: 1px solid #444;
            border-radius: 0 0 3px 3px;
            position: relative;
            height: 28px;
        }
        .mini-key.highlight {
            background: var(--accent-color, #f3c747);
            border-color: var(--accent-color, #c49a2b);
        }
        .mini-blackkeys {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            height: 17px;
            pointer-events: none;
        }
        .mini-black-slot {
            flex: 1;
            display: flex;
            justify-content: center;
        }
        .mini-black-slot.empty {
            visibility: hidden;
        }
        .mini-black {
            width: 62%;
            height: 100%;
            background: #333;
            border-radius: 0 0 2px 2px;
        }
        .mini-black-slot.highlight .mini-black {
            background: var(--accent-color, #a18225) !important;
        }

        /* Bottom CTA Section */
        .cta-section {
            background: var(--bg-secondary);
            padding: 80px 32px;
            margin-top: 80px;
            border-top: 1px solid var(--border-subtle);
            border-bottom: 1px solid var(--border-subtle);
        }

        .cta-inner {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 48px;
            flex-wrap: wrap;
        }

        .cta-content {
            flex: 1 1 340px;
            min-width: 280px;
        }

        .cta-title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            line-height: 1.25;
        }

        .cta-subtitle {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .cta-form {
            flex: 1 1 320px;
            display: flex;
            gap: 8px;
            min-width: 280px;
        }

        .cta-input {
            flex: 1;
            padding: 12px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 2px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .cta-input:focus {
            border-color: var(--text-primary);
        }

        .cta-btn {
            padding: 12px 24px;
            white-space: nowrap;
        }

        /* Site Footer */
        .site-footer {
            background: var(--bg-primary);
            padding: 64px 32px 24px;
        }

        .footer-inner {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1.5fr 1fr 1fr 1fr;
            gap: 48px;
            padding-bottom: 48px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .footer-col {
            min-width: 0;
        }

        .footer-logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 10px;
            letter-spacing: 0.3px;
        }

        .footer-tagline {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .footer-title {
            font-size: 0.68rem;
            letter-spacing: 2px;
            color: var(--text-primary);
            text-transform: uppercase;
            margin-bottom: 16px;
            font-weight: 500;
        }

        .footer-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .footer-list li {
            margin-bottom: 8px;
        }

        .footer-list a {
            color: var(--text-secondary);
            font-size: 0.85rem;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer-list a:hover {
            color: var(--text-primary);
        }

        .footer-bottom {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-dim);
            flex-wrap: wrap;
            gap: 8px;
        }

        .footer-made {
            font-style: italic;
            font-family: 'Playfair Display', serif;
        }

        @media (max-width: 768px) {
            .cta-section {
                padding: 56px 20px;
                margin-top: 48px;
            }
            .cta-inner {
                flex-direction: column;
                align-items: flex-start;
            }
            .cta-title {
                font-size: 1.5rem;
            }
            .footer-inner {
                grid-template-columns: 1fr 1fr;
                gap: 32px;
                padding-bottom: 32px;
            }
            .footer-bottom {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        @media (max-width: 480px) {
            .footer-inner {
                grid-template-columns: 1fr;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-subtle);
            border-radius: 2px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        /* Floating Main Menu (Top-Right) */
        .floating-menu {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 999;
        }

        .menu-trigger {
            width: 44px;
            height: 44px;
            border-radius: 2px;
            background: var(--text-primary);
            color: var(--bg-primary);
            border: 1px solid var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.2s ease;
        }

        .menu-trigger:hover {
            opacity: 0.85;
        }

        .menu-trigger.active {
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .menu-dropdown {
            position: absolute;
            top: 52px;
            right: 0;
            min-width: 260px;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 2px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
            overflow: hidden;
            display: none;
        }

        .menu-dropdown.visible {
            display: block;
            animation: menuIn 0.15s ease;
        }

        @keyframes menuIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .menu-section {
            padding: 6px 0;
            border-bottom: 1px solid var(--border-subtle);
        }

        .menu-section:last-child {
            border-bottom: none;
        }

        .menu-section-title {
            font-size: 0.65rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 8px 16px 4px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 10px 16px;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.85rem;
            text-align: left;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .menu-item:hover {
            background: var(--bg-hover);
        }

        .menu-item-icon {
            font-size: 0.95rem;
            width: 20px;
            text-align: center;
        }

        .menu-item-text {
            flex: 1;
        }

        .menu-item-shortcut {
            font-size: 0.7rem;
            color: var(--text-dim);
        }

        /* Save Dialog */
        .save-dialog {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            min-width: 380px;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 2px;
            padding: 24px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
            z-index: 2100;
            display: none;
        }

        .save-dialog.visible {
            display: block;
            animation: menuIn 0.15s ease;
        }

        .save-dialog-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            color: var(--text-primary);
            margin-bottom: 12px;
            font-weight: 600;
        }

        .save-dialog-hint {
            font-size: 0.82rem;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .save-name-input {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: 2px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9rem;
            margin-bottom: 16px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .save-name-input:focus {
            border-color: var(--text-primary);
        }

        .save-dialog-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .save-dialog-actions .btn {
            padding: 10px 20px;
            font-size: 0.82rem;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--text-primary);
            color: var(--bg-primary);
            padding: 12px 24px;
            border-radius: 2px;
            font-size: 0.85rem;
            font-weight: 500;
            opacity: 0;
            transition: transform 0.3s ease, opacity 0.3s ease;
            z-index: 10000;
            pointer-events: none;
            letter-spacing: 0.3px;
        }
        .toast.visible {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Save Conflict Dialog */
        .conflict-list {
            max-height: 200px;
            overflow-y: auto;
            margin: 12px 0;
            border: 1px solid var(--border-subtle);
            border-radius: 2px;
        }

        .conflict-item {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-subtle);
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .conflict-item:last-child {
            border-bottom: none;
        }

        .conflict-item:hover {
            background: var(--bg-hover);
        }

        .conflict-item-title {
            font-size: 0.88rem;
            color: var(--text-primary);
        }

        .conflict-item-meta {
            font-size: 0.72rem;
            color: var(--text-dim);
            margin-top: 2px;
        }

        /* Favorites List */
        .favorites-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .favorite-item {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            gap: 12px;
            transition: background 0.15s ease;
        }

        .favorite-item:hover {
            background: var(--bg-hover);
        }

        .favorite-info {
            flex: 1;
            min-width: 0;
        }

        .favorite-title {
            font-size: 0.88rem;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .favorite-meta {
            font-size: 0.72rem;
            color: var(--text-dim);
            margin-top: 2px;
        }

        .favorite-actions {
            display: flex;
            gap: 6px;
        }

        .favorite-action-btn {
            padding: 5px 10px;
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: 2px;
            color: var(--text-secondary);
            font-size: 0.72rem;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .favorite-action-btn:hover {
            color: var(--text-primary);
            border-color: var(--text-primary);
        }

        .favorite-action-btn.delete:hover {
            color: var(--accent-rose);
            border-color: var(--accent-rose);
        }

        .empty-favorites {
            padding: 24px 16px;
            text-align: center;
            color: var(--text-dim);
            font-size: 0.82rem;
        }

        /* Modal overlay */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            z-index: 1400;
            display: none;
        }

        .modal-overlay.visible {
            display: block;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Favorites/Chart List */
        .version-list {
            max-height: 350px;
            overflow-y: auto;
        }

        .version-item {
            display: flex;
            align-items: flex-start;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-subtle);
            gap: 12px;
            transition: background 0.15s ease;
        }

        .version-item:last-child {
            border-bottom: none;
        }

        .version-item:hover {
            background: var(--bg-hover);
        }

        .version-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 48px;
            height: 24px;
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-gold-dim));
            color: var(--bg-primary);
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            flex-shrink: 0;
        }

        .version-info {
            flex: 1;
            min-width: 0;
        }

        .version-title {
            font-size: 0.9rem;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .version-meta {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-top: 3px;
            line-height: 1.5;
        }

        .version-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 24px 16px 100px;
            }

            .search-row {
                flex-direction: column;
            }

            .mode-toggle {
                width: auto;
            }

            .mode-btn {
                flex: none;
                padding: 6px 14px;
            }

            .chord-presets {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        /* ============== Top Navigation ============== */
        .top-nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 900;
            height: 60px;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            padding: 0 32px;
            gap: 32px;
        }
        .nav-logo {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            font-family: 'Playfair Display', serif;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .nav-links {
            display: flex;
            gap: 4px;
            flex: 0 0 auto;
        }
        .nav-btn {
            padding: 6px 16px;
            border: none;
            background: transparent;
            border-radius: 2px;
            color: var(--text-secondary);
            font-size: 0.82rem;
            font-family: inherit;
            cursor: pointer;
            letter-spacing: 0.3px;
            transition: color 0.15s ease;
        }
        .nav-btn:hover { color: var(--text-primary); }
        .nav-btn.active { color: var(--text-primary); font-weight: 600; }
        .nav-btn.active::after {
            content: '';
            display: block;
            height: 1px;
            background: var(--text-primary);
            margin-top: 4px;
        }
        .nav-search {
            position: relative;
            flex: 1;
            max-width: 320px;
            margin-left: auto;
        }
        .nav-search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
            font-size: 0.9rem;
        }
        .nav-search-input {
            width: 100%;
            padding: 8px 12px 8px 34px;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 4px;
            color: var(--text-primary);
            font-size: 0.8rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s ease;
        }
        .nav-search-input::placeholder { color: var(--text-dim); }
        .nav-search-input:focus { border-color: var(--text-secondary); }
        .nav-auth, .nav-user {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-left: auto;
            position: relative;
        }

        .nav-user-toggle {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: transparent;
            border: 1px solid var(--border-subtle);
            border-radius: 2px;
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-family: inherit;
            cursor: pointer;
            transition: color 0.15s ease, border-color 0.15s ease;
            letter-spacing: 0.3px;
        }

        .nav-user-toggle:hover {
            color: var(--text-primary);
            border-color: var(--text-secondary);
        }

        .nav-user-toggle.active {
            color: var(--text-primary);
            border-color: var(--text-primary);
        }

        .nav-user-caret {
            font-size: 0.65rem;
            line-height: 1;
        }

        .nav-user-menu {
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            min-width: 140px;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 2px;
            padding: 4px 0;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            display: none;
            z-index: 100;
        }

        .nav-user-menu.visible {
            display: block;
        }

        .nav-user-menu-item {
            display: block;
            width: 100%;
            padding: 8px 14px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-family: inherit;
            text-align: left;
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
            letter-spacing: 0.3px;
        }

        .nav-user-menu-item:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .nav-auth-btn {
            padding: 6px 16px;
            border: 1px solid transparent;
            background: transparent;
            border-radius: 2px;
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-family: inherit;
            cursor: pointer;
            transition: color 0.15s ease, border-color 0.15s ease;
        }
        .nav-auth-btn:hover { color: var(--text-primary); }
        .nav-auth-btn.primary {
            background: var(--text-primary);
            color: var(--bg-primary);
            border-color: var(--text-primary);
        }
        .nav-auth-btn.primary:hover { background: var(--text-secondary); border-color: var(--text-secondary); color: var(--bg-primary); }
        .nav-username {
            font-size: 0.8rem;
            color: var(--text-secondary);
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ============== Page Sections ============== */
        #pageHome { display: block; }
        #pageMy { display: none; }

        .confirm-modal {
            z-index: 3000;
        }

        .confirm-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0 0 12px;
        }
        .confirm-message {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin: 0 0 24px;
            line-height: 1.5;
        }
        .confirm-actions {
            display: flex;
            gap: 12px;
        }
        .confirm-actions .btn {
            flex: 1;
            padding: 10px 24px;
            font-size: 0.9rem;
            border-radius: 2px;
        }

        /* ============== Modal ============== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: rgba(0,0,0,0.35);
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.visible { display: flex; }
        .modal-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 2px;
            width: 360px;
            max-width: 90vw;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px 0;
        }
        .modal-title { font-size: 1rem; font-weight: 600; color: var(--text-primary); }
        .modal-close {
            background: none; border: none;
            font-size: 1.4rem; color: var(--text-dim);
            cursor: pointer; line-height: 1; padding: 0;
        }
        .modal-close:hover { color: var(--text-primary); }
        .modal-body { padding: 16px 20px; }
        .modal-footer {
            padding: 0 20px 16px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .modal-footer a { color: var(--accent-gold); text-decoration: none; }
        .modal-footer a:hover { text-decoration: underline; }

        /* Search Results Modal */
        .search-results-content {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .search-result-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: 2px;
            transition: border-color 0.2s;
        }
        .search-result-item:hover {
            border-color: var(--text-secondary);
        }
        .search-result-info {
            flex: 1;
            min-width: 0;
        }
        .search-result-name {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .search-result-chords-badge {
            font-size: 0.75rem;
            padding: 2px 6px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border-radius: 4px;
            margin-left: 6px;
        }
        .search-result-meta {
            font-size: 0.78rem;
            color: var(--text-dim);
        }
        .search-result-artist {
            color: var(--text-secondary);
        }
        .search-result-album {
            color: var(--text-dim);
        }
        .search-result-btn {
            padding: 6px 14px;
            font-size: 0.82rem;
            white-space: nowrap;
        }
        .search-result-loading {
            text-align: center;
            padding: 20px;
            color: var(--text-dim);
        }
        .search-result-empty {
            text-align: center;
            padding: 20px;
            color: var(--text-dim);
            font-size: 0.85rem;
        }

        /* ============== Form ============== */
        .form-group { margin-bottom: 12px; }
        .form-label {
            display: block;
            font-size: 0.78rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .form-input {
            width: 100%;
            padding: 8px 12px;
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.9rem;
            font-family: inherit;
            box-sizing: border-box;
            transition: border-color 0.15s ease;
        }
        .form-input:focus { outline: none; border-color: var(--accent-gold); }
        .form-error {
            font-size: 0.78rem;
            color: var(--accent-rose);
            margin-bottom: 8px;
            min-height: 16px;
        }
        .btn-full { width: 100%; }

        /* ============== My Charts & Public Charts Page ============== */
        .page-section {
            max-width: 720px;
            margin: 0 auto;
            padding: 20px 16px;
        }
        /* ============== Gallery Layout (Aria Folio style) ============== */
        .gallery-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 48px 32px;
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 48px;
        }
        .gallery-sidebar {
            font-size: 0.8rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }
        .sidebar-section {
            margin-bottom: 36px;
        }
        .sidebar-title {
            font-size: 0.68rem;
            letter-spacing: 2px;
            color: var(--text-dim);
            margin-bottom: 14px;
            text-transform: uppercase;
        }
        .sidebar-list {
            list-style: none;
            border-top: 1px solid var(--border-subtle);
        }
        .sidebar-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 2px;
            border-bottom: 1px solid var(--border-subtle);
            cursor: pointer;
            transition: color 0.15s ease;
        }
        .sidebar-list li:hover { color: var(--text-primary); }
        .sidebar-list li span:first-child { font-size: 0.8rem; }
        .sidebar-count { font-size: 0.7rem; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }
        .sidebar-card {
            border: 1px solid var(--border-subtle);
            padding: 18px;
            margin-top: 12px;
            background: var(--bg-card);
        }
        .sidebar-card-title {
            font-size: 0.85rem;
            color: var(--text-primary);
            margin-bottom: 10px;
            font-weight: 600;
            font-family: 'Playfair Display', serif;
        }
        .sidebar-card-body {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 12px;
            line-height: 1.6;
        }
        .sidebar-card-link {
            font-size: 0.75rem;
            color: var(--text-primary);
            text-decoration: none;
            letter-spacing: 0.3px;
            border-bottom: 1px solid var(--border-subtle);
        }
        .sidebar-card-link:hover { border-color: var(--text-primary); }

        .gallery-main {
            min-width: 0;
        }
        .gallery-main.gallery-home {
            max-width: 1200px;
            margin: 0 auto;
            padding: 48px 32px;
        }

        /* ===== My Library 新样式 ===== */
        .gallery-main.gallery-my {
            max-width: 1200px;
            margin: 0 auto;
            padding: 48px 32px 80px;
        }

        .library-header {
            display: flex;
            justify-content: flex-start;
            align-items: flex-end;
            margin-bottom: 48px;
        }

        .library-title-block {
            min-width: 0;
            line-height: 1;
            text-align: left;
        }

        .library-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.25rem;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0 0 8px;
            line-height: 1;
            letter-spacing: -0.5px;
            text-align: left;
        }

        .library-subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin: 0;
            letter-spacing: 0.2px;
            line-height: 1;
            text-align: left;
        }

        .library-toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-shrink: 0;
            margin-left: auto;
        }

        .chip-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: transparent;
            border: 1px solid var(--border-subtle);
            border-radius: 999px;
            color: var(--text-secondary);
            font-size: 0.78rem;
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            letter-spacing: 0.2px;
            white-space: nowrap;
        }

        .chip-btn:hover {
            border-color: var(--text-primary);
            color: var(--text-primary);
        }

        .chip-btn-primary {
            background: var(--text-primary);
            border-color: var(--text-primary);
            color: #fff;
        }

        .chip-btn-primary:hover {
            opacity: 0.85;
            color: #fff;
        }

        .chip-icon {
            font-size: 0.8rem;
            line-height: 1;
        }

        .chart-grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 56px 40px;
        }

        @media (max-width: 720px) {
            .chart-grid-2 {

            .library-title {
                font-size: 1.75rem;
            }
        }

        .library-card {
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .library-card:hover {
            opacity: 0.92;
        }

        .library-cover {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 4;
            background: #EFEFE9;
            border: 1px solid var(--border-subtle);
            margin-bottom: 16px;
            overflow: hidden;
        }

        .library-cover svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 右上角标签（缩小） */
        .library-level {
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 0.52rem;
            letter-spacing: 1px;
            padding: 3px 8px;
            border-radius: 999px;
            text-transform: uppercase;
            font-weight: 500;
            background: #111;
            color: #fff;

        .library-level.private {
            background: #fff;
            color: #111;
            border: 1px solid var(--border-subtle);
        }

        .library-info {
            padding: 0 2px;
        }

        /* 标题行：歌曲名 + 三点菜单 */
        .library-title-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 4px;
        }

        .library-card-title {
            font-family: 'Playfair Display', 'Noto Serif SC', serif;
            font-size: 1.35rem;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.3;
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;

            flex-shrink: 0;
        }

        .card-menu-btn {
            width: 26px;
            height: 26px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-secondary);
            font-size: 1.1rem;

            justify-content: center;

            border-color: var(--border-subtle);

        .card-menu-btn:focus-visible {
            outline: 1px solid var(--text-primary);
            outline-offset: 1px;
        }

        /* 下拉菜单 */
        .card-menu-dropdown {
            position: absolute;
            top: calc(100% + 4px);
            right: 0;
            min-width: 120px;

            padding: 8px 12px;

        }

            color: #c06070;
        }

        .card-menu-dropdown button.card-menu-danger:hover {
            background: rgba(192, 96, 112, 0.08);
        }

        .library-card-artist {
            font-size: 0.72rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 12px;
        }

        .library-tags {

            gap: 8px;
            flex-wrap: wrap;
        }

        .tag-pill {

            padding: 3px 8px;

            letter-spacing: 0.3px;

            justify-content: space-between;

            border-top: 1px solid var(--border-subtle);

            color: var(--text-secondary);

            align-items: center;
            gap: 6px;
            letter-spacing: 0.3px;

        .footer-icon {
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .library-actions {
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1px solid var(--border-subtle);
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.85rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            line-height: 1;
        }

        .icon-btn:hover {
            border-color: var(--text-primary);
            color: var(--text-primary);
        }

        .icon-btn.danger:hover {
            border-color: #c06070;
            color: #c06070;
        }

        /* ===== 原 grid-card 兼容 ===== */

            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            font-size: 0.72rem;
            color: var(--text-dim);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .gallery-meta { font-family: 'JetBrains Mono', monospace; }
        .gallery-sort-select {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 0.72rem;
            font-family: inherit;
            cursor: pointer;
            outline: none;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .chart-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 48px 32px;
        }
        .grid-card {

            transition: opacity 0.2s ease;
        }

        .grid-card-cover {

            margin-bottom: 18px;
            overflow: hidden;

        }

            height: 100%;

            top: 14px;
            left: 14px;

            display: inline-block;
            font-size: 0.62rem;

            color: var(--text-secondary);

            letter-spacing: 0.5px;

        }
        .grid-card-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;

        .grid-action-btn {
            padding: 5px 12px;
            border-radius: 2px;
            border: 1px solid var(--border-subtle);

            color: var(--text-secondary);

            font-family: inherit;

            transition: all 0.15s ease;

        .grid-action-btn.danger:hover { border-color: var(--accent-rose); color: var(--accent-rose); }
        .grid-action-btn.save:hover { border-color: var(--text-primary); color: var(--text-primary); }

        .empty-list {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-dim);
            font-size: 0.8rem;
            grid-column: 1 / -1;
        }
        .empty-list-icon { font-size: 2.2rem; margin-bottom: 12px; }

        /* ============== Chart Viewer (Read-only) ============== */
        .chart-viewer {
            background: var(--bg-card);

            padding: 20px;
            margin-bottom: 16px;

            align-items: flex-start;

        .chart-viewer-title { font-size: 1rem; font-weight: 700; color: var(--text-primary); }
        .chart-viewer-author { font-size: 0.75rem; color: var(--text-dim); margin-top: 2px; }
        .chart-viewer-song { font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px; }
        .chart-viewer-back {
            padding: 4px 10px;
            border: 1px solid var(--border-subtle);
            border-radius: 5px;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.75rem;
            cursor: pointer;
        }
        .chart-viewer-back:hover { border-color: var(--accent-gold-dim); color: var(--accent-gold); }

        .back-btn {
            padding: 8px 16px;
            background: transparent;
            border: 1px solid var(--border-subtle);
            border-radius: 2px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;

        .back-btn:hover {
            border-color: var(--text-secondary);
            color: var(--text-primary);
        }
        .back-btn:focus-visible {
            outline: 2px solid var(--text-primary);
            outline-offset: 2px;
        }

        .save-btn {
            padding: 8px 18px;
            background: var(--text-primary);
            color: var(--bg-primary);
            border: 1px solid var(--text-primary);

            font-family: inherit;
            font-weight: 500;
            cursor: pointer;

            align-items: center;

            outline: 2px solid var(--text-primary);

        }
        .save-icon {
            font-size: 0.9rem;
            font-weight: 700;
        }
        .save-label {
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>

    <!-- 首页（网格视图） -->

            <!-- Search Section (edit mode only) -->

            <!-- Lyrics Section -->

                                <option value="5">F</option>

                                    <path d="M2 17l10 5 10-5"/>
                                    <path d="M2 12l10 5 10-5"/>

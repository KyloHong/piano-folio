        var sectionDropdownOutsideHandler = null;

        // Parse chord name into its constituent semitone positions (mod 12)
        // Returns { rootSemitone: number, pitches: [number, ...] } or null
        function parseChordToPitches(chordName) {
            if (!chordName) return null;
            const name = chordName.trim();

            // 1. Extract root note (supports C, C#, Cb, Db, etc.)
            const rootMatch = name.match(/^([A-G])([#b]?)/);
            if (!rootMatch) return null;

            const rootLetter = rootMatch[1];
            const rootAccidental = rootMatch[2];
            let rootSemitone = noteToSemitone[rootLetter];
            if (rootAccidental === '#') rootSemitone = (rootSemitone + 1) % 12;
            if (rootAccidental === 'b') rootSemitone = (rootSemitone + 11) % 12;

            // 2. Determine chord quality / type from the remainder
            const remainder = name.substring(rootMatch[0].length);

            // Ordered mapping of string-pattern -> quality key (longest-match first)
            const qualityPatterns = [
                ['maj7', 'maj7'],
                ['Maj7', 'maj7'],
                ['m7b5', 'dim'],     // half-diminished treated as dim for pitch display
                ['m7', 'm7'],
                ['dim7', 'dim7'],
                ['dim', 'dim'],
                ['aug', 'aug'],
                ['sus4', 'sus4'],
                ['sus2', 'sus2'],
                ['7', '7'],
                ['maj', 'major'],
                ['M', 'major'],
                ['m', 'minor']
            ];

            let selectedQuality = 'major';
            for (const [pat, key] of qualityPatterns) {
                if (remainder.indexOf(pat) !== -1) {
                    selectedQuality = key;
                    break;
                }
            }

            // 3. Lookup intervals
            let intervals = chordIntervals[selectedQuality]
                ? [...chordIntervals[selectedQuality]]
                : [...chordIntervals['major']];

            // 4. Detect extension (7, 9, add9, add2, sus4 handled above)
            // remainder may have "7" "9" "add9" etc.
            // If selectedQuality already produced "7" chord, skip adding again.
            const alreadyHas7 = ['7', 'maj7', 'm7', 'dim7'].includes(selectedQuality);
            if (!alreadyHas7) {
                if (remainder.indexOf('add9') !== -1 && intervals.indexOf(14) === -1) {
                    intervals.push(14);
                } else if (remainder.indexOf('add2') !== -1 && intervals.indexOf(2) === -1) {
                    intervals.push(2);
                } else if (remainder.indexOf('9') !== -1) {
                    // Treat as 7 + 9th color note
                    if (intervals.indexOf(10) === -1) intervals.push(10);
                    if (intervals.indexOf(14) === -1) intervals.push(14);
                } else if (remainder.indexOf('7') !== -1 && intervals.indexOf(10) === -1) {
                    intervals.push(10);
                }
            }

            // 5. Dedupe pitches within one octave
            const pitchSet = new Set();
            intervals.forEach(semi => {
                pitchSet.add((rootSemitone + semi) % 12);
            });

            return {
                rootSemitone: rootSemitone,
                pitches: Array.from(pitchSet).sort((a, b) => a - b)
            };
        }

        // Render a mini one-octave piano keyboard with highlighted pitches
        // pitches: array of 0..11 semitones from C
        function renderMiniPiano(pitches) {
            if (!pitches || pitches.length === 0) return '';
            const pitchSet = new Set(pitches);

            // White keys in order: C (0), D (2), E (4), F (5), G (7), A (9), B (11)
            const whiteKeys = [
                { semi: 0,  hasBlack: true },  // C, next is C#
                { semi: 2,  hasBlack: true },  // D, next is D#
                { semi: 4,  hasBlack: false }, // E, no black key after
                { semi: 5,  hasBlack: true },  // F, next is F#
                { semi: 7,  hasBlack: true },  // G, next is G#
                { semi: 9,  hasBlack: true },  // A, next is A#
                { semi: 11, hasBlack: false }  // B, no black key after
            ];
            // Black keys: C#(1), D#(3), F#(6), G#(8), A#(10)
            const blackSemitones = [1, 3, 6, 8, 10];

            const whiteHtml = whiteKeys.map(w => {
                const isHL = pitchSet.has(w.semi) ? ' highlight' : '';
                return `<div class="mini-key${isHL}"></div>`;
            }).join('');

            // Black key slots: one slot between each pair of white keys = 6 slots
            // Slot i (0-indexed between white keys i and i+1) has black key if:
            //   slot 0 (between C-D): C# -> semi 1
            //   slot 1 (between D-E): D# -> semi 3
            //   slot 2 (between E-F): empty
            //   slot 3 (between F-G): F# -> semi 6
            //   slot 4 (between G-A): G# -> semi 8
            //   slot 5 (between A-B): A# -> semi 10
            const blackSlots = [1, 3, null, 6, 8, 10];
            const blackHtml = blackSlots.map(semi => {
                if (semi === null) {
                    return `<div class="mini-black-slot empty"><div class="mini-black"></div></div>`;
                }
                const isHL = pitchSet.has(semi) ? ' highlight' : '';
                return `<div class="mini-black-slot${isHL}"><div class="mini-black"></div></div>`;
            }).join('');

            return `<div class="mini-piano">
                ${whiteHtml}
                <div class="mini-blackkeys">${blackHtml}</div>
            </div>`;
        }

        // Build a flat ordered list of all chord occurrences:
        // [{ lineIndex, charIndex, pos, chord }]
        function collectChordOccurrences() {
            const list = [];
            if (!state.chordData) return list;
            Object.keys(state.chordData).forEach(lineIdxKey => {
                const lineIndex = parseInt(lineIdxKey);
                const charData = state.chordData[lineIdxKey];
                if (!charData) return;
                Object.keys(charData).forEach(posKey => {
                    const data = charData[posKey];
                    if (!data || !data.chord) return;
                    // posKey format: "charIndex_position" (e.g. "0_current", "3_pre")
                    const parts = posKey.split('_');
                    const charIndex = parseInt(parts[0]);
                    const pos = parts[1] || 'current';
                    list.push({
                        lineIndex,
                        charIndex,
                        pos,
                        chord: data.chord.trim()
                    });
                });
            });
            // Sort by line, then by char position, then by "pos" order: pre < current < post
            const posRank = { pre: 0, current: 1, post: 2 };
            list.sort((a, b) => {
                if (a.lineIndex !== b.lineIndex) return a.lineIndex - b.lineIndex;
                if (a.charIndex !== b.charIndex) return a.charIndex - b.charIndex;
                return (posRank[a.pos] || 1) - (posRank[b.pos] || 1);
            });
            return list;
        }

        // Try to detect a repeating chord-loop pattern
        // e.g. [C, G, Am, F, C, G, Am, F] -> loop=[C, G, Am, F], repeat=2
        function detectLoop(sequence) {
            const n = sequence.length;
            if (n < 2) return { loop: sequence, repeat: 1 };
            // Try loop length L from 1 to n/2, that evenly divides n
            for (let L = 1; L <= Math.floor(n / 2); L++) {
                if (n % L !== 0) continue;
                const rep = n / L;
                const candidate = sequence.slice(0, L);
                let ok = true;
                for (let r = 1; r < rep; r++) {
                    for (let i = 0; i < L; i++) {
                        if (sequence[r * L + i] !== candidate[i]) {
                            ok = false;
                            break;
                        }
                    }
                    if (!ok) break;
                }
                if (ok) return { loop: candidate, repeat: rep };
            }
            return { loop: sequence, repeat: 1 };
        }

        // Update chord summary
        function updateSummary() {
            const occurrences = collectChordOccurrences();

            // ===== 1. 和弦统计（保留原有功能） =====
            const chordCount = {};
            occurrences.forEach(occ => {
                const name = occ.chord;
                chordCount[name] = (chordCount[name] || 0) + 1;
            });
            const chordStats = Object.entries(chordCount).sort((a, b) => b[1] - a[1]);

            if (chordStats.length === 0) {
                chordSummary.style.display = 'none';
                return;
            }
            chordSummary.style.display = 'block';

            // Render statistics grid
            const offset = state.keyOffset || 0;
            summaryGrid.innerHTML = chordStats.map(([chord, count]) => {
                const displayChord = transposeChordName(chord, offset);
                const pitches = parseChordToPitches(chord);
                const piano = pitches ? renderMiniPiano(pitches.pitches) : '';
                return `<div class="summary-item">
                    <div class="summary-chord">${escapeHtml(displayChord)}</div>
                    ${piano}
                    <div class="summary-count">出现 ${count} 次</div>
                </div>`;
            }).join('');

            // ===== 2. 段落和弦走向 =====
            const summaryProg = document.getElementById('summaryProgressions');
            if (!summaryProg) {
                // fall back
                return;
            }

            // Group occurrences by section
            // Sections live in state.song.sections = { lineIndex: "段落名" }
            // Sections are declared at a starting line, and apply until the next declared section.
            const sectionsMap = (state.song && state.song.sections) ? state.song.sections : {};
            // Collect sorted list of section starting lines
            const sortedSectionLines = Object.keys(sectionsMap)
                .map(k => parseInt(k))
                .sort((a, b) => a - b);

            if (sortedSectionLines.length === 0) {
                // No sections defined - show all chords as a single progression
                const allSequence = occurrences.map(o => o.chord);
                if (allSequence.length === 0) {
                    summaryProg.innerHTML = '<div style="color: var(--text-dim); font-size: 0.85rem;">请先在"编辑模式"中为每一行标记段落（前奏 / 主歌 / 副歌 / 桥段 / 尾奏 等）</div>';
                } else {
                    const { loop, repeat } = detectLoop(allSequence);
                    summaryProg.innerHTML = `<div class="progression-block">
                        <div class="progression-header">
                            <span class="progression-section-name">整曲</span>
                            ${repeat > 1 ? `<span class="progression-loop-badge">循环 × ${repeat}</span>` : ''}
                        </div>
                        <div class="progression-row">
                            ${renderProgressionRow(loop)}
                        </div>
                    </div>`;
                }
                return;
            }

            // Assign each chord occurrence to a section (nearest section-start at or before the line)
            function findSectionForLine(lineIndex) {
                let section = null;
                let sectionStart = -1;
                for (const sLine of sortedSectionLines) {
                    if (sLine <= lineIndex) {
                        section = sectionsMap[sLine];
                        sectionStart = sLine;
                    } else {
                        break;
                    }
                }
                return { section, sectionStart };
            }

            // Group occurrences by section name (preserving section order)
            const orderedSections = []; // [{name, sequence:[chord...]}]
            const sectionByNameIdx = {};
            for (const sLine of sortedSectionLines) {
                const secName = sectionsMap[sLine];
                if (sectionByNameIdx[secName] === undefined) {
                    sectionByNameIdx[secName] = orderedSections.length;
                    orderedSections.push({ name: secName, sequence: [] });
                }
            }
            occurrences.forEach(occ => {
                const { section } = findSectionForLine(occ.lineIndex);
                if (section === null) return; // before first section - skip from section breakdown
                const idx = sectionByNameIdx[section];
                if (idx !== undefined) orderedSections[idx].sequence.push(occ.chord);
            });

            // Build HTML blocks
            const blocksHtml = orderedSections
                .filter(sec => sec.sequence.length > 0)
                .map(sec => {
                    const { loop, repeat } = detectLoop(sec.sequence);
                    return `<div class="progression-block">
                        <div class="progression-header">
                            <span class="progression-section-name">${escapeHtml(sec.name)}</span>
                            <span style="font-size: 0.75rem; color: var(--text-dim);">共 ${sec.sequence.length} 个和弦</span>
                            ${repeat > 1 ? `<span class="progression-loop-badge">循环 × ${repeat}</span>` : ''}
                        </div>
                        <div class="progression-row">
                            ${renderProgressionRow(loop)}
                        </div>
                    </div>`;
                }).join('');

            if (!blocksHtml) {
                summaryProg.innerHTML = '<div style="color: var(--text-dim); font-size: 0.85rem;">标记段落并添加和弦后，此处会显示每段的和弦走向</div>';
            } else {
                summaryProg.innerHTML = blocksHtml;
            }
        }

        // Render a progression loop row: [chord] → [chord] → ...
        function renderProgressionRow(chordSequence) {
            const offset = state.keyOffset || 0;
            return chordSequence.map((chord, i) => {
                const displayChord = transposeChordName(chord, offset);
                const arrow = (i < chordSequence.length - 1)
                    ? `<span class="progression-arrow">→</span>`
                    : '';
                return `<div class="progression-card">
                    <div class="progression-chord">${escapeHtml(displayChord)}</div>
                </div>${arrow}`;
            }).join('');
        }

        // 导出全部图谱为 JSON 文件下载
        function exportCharts() {
            const count = Object.keys(state.favorites).length;
            if (count === 0) {
                alert('当前没有已保存的图谱，无法导出');
                return;
            }
            const data = {
                version: 1,
                exportedAt: new Date().toISOString(),
                charts: state.favorites
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `piano-charts-${new Date().toISOString().slice(0, 10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // 导入图谱（合并到现有收藏）
        function importCharts(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const data = JSON.parse(e.target.result);
                    const charts = data.charts || {};
                    if (typeof charts !== 'object' || Object.keys(charts).length === 0) {
                        alert('未找到有效的图谱数据');
                        return;
                    }
                    let added = 0;
                    const now = Date.now();
                    Object.values(charts).forEach(chart => {
                        // 已有同名图谱则跳过，否则以新 ID 导入
                        const existing = Object.values(state.favorites).find(f => f.name === chart.name);
                        if (!existing) {
                            const newId = generateId();
                            state.favorites[newId] = {
                                id: newId,
                                name: chart.name,
                                song: chart.song,
                                chordData: chart.chordData || {},
                                displayMode: chart.displayMode || 'name',
                                createdAt: chart.createdAt || now,
                                updatedAt: chart.updatedAt || now,
                                serverId: chart.serverId || null
                            };
                            added++;
                        }
                    });
                    if (added === 0) {
                        alert('导入完成：所有图谱已存在，未添加新记录');
                    } else {
                        saveToStorage();
                        updateFavCount();
                        alert(`导入成功：新增 ${added} 条图谱`);
                    }
                } catch (err) {
                    alert('导入失败：文件格式不正确，请选择导出的 JSON 文件');
                }
            };
            reader.readAsText(file);
        }

        // Open save dialog - 简化逻辑：保存即覆盖/更新，另存为创建新图谱
        function openSaveDialog(mode) {
            const dialog = document.getElementById('saveDialog');
            const overlay = document.getElementById('saveOverlay');
            const input = document.getElementById('saveNameInput');
            const saveBtn = document.getElementById('saveConfirm');
            const saveAsBtn = document.getElementById('saveAsConfirm');
            const hint = document.getElementById('saveDialogHint');

            // 检查当前图谱是否有 serverId（有则显示"另存为"按钮）
            const currentFav = state.currentChartId ? state.favorites[state.currentChartId] : null;
            _saveDialogHasServerId = !!(currentFav && currentFav.serverId);
            
            // 预填名称：新建图谱时使用歌曲名称，已有图谱时保留原名称
            if (_saveDialogHasServerId && !mode) {
                // 编辑已有图谱，保留原名称
                _saveDialogOriginalName = state.currentChartName || state.song.title || '';
            } else {
                // 新建图谱或另存为，使用歌曲名称
                _saveDialogOriginalName = state.song.title || '';
            }

            // 预填名称
            input.value = mode === 'saveas' ? (_saveDialogOriginalName ? `${_saveDialogOriginalName} 副本` : '') : _saveDialogOriginalName;

            // 另存为模式下：另存为为主按钮，保存为副按钮
            if (mode === 'saveas') {
                document.getElementById('saveDialogTitle').textContent = '另存为新图谱';
                hint.textContent = '以新名称保存一份副本';
                saveBtn.classList.remove('btn-primary');
                saveBtn.classList.add('btn-secondary');
                saveBtn.textContent = '保存';
                saveAsBtn.classList.remove('btn-secondary');
                saveAsBtn.classList.add('btn-primary');
                saveAsBtn.style.display = _saveDialogHasServerId ? 'inline-block' : 'none';
            } else {
                // 默认模式：保存即更新（名称改变也只是更新同一图谱）
                document.getElementById('saveDialogTitle').textContent = '保存图谱';
                hint.textContent = _saveDialogHasServerId ? '将更新云端图谱，其他设备同步可见' : '保存后可在「我的图谱」中查看';
                saveBtn.classList.remove('btn-secondary');
                saveBtn.classList.add('btn-primary');
                saveBtn.textContent = '保存';
                saveAsBtn.classList.remove('btn-primary');
                saveAsBtn.classList.add('btn-secondary');
                saveAsBtn.style.display = _saveDialogHasServerId ? 'inline-block' : 'none';
            }

            dialog.classList.add('visible');
            overlay.classList.add('visible');
            setTimeout(() => input.focus(), 100);
        }

        // 确认保存 - 有 serverId 则覆盖更新（不管名称是否改变），否则创建新图谱
        function confirmSave() {
            // 强校验：歌曲标题和歌手必须填写
            const title = document.getElementById('songTitleInput')?.value.trim();
            const artist = document.getElementById('songArtistInput')?.value.trim();
            
            if (!title) {
                alert('请输入歌曲名称');

                return;
            }
            
            if (!artist) {
                alert('请输入歌手名称');
                document.getElementById('songArtistInput')?.focus();
                return;
            }
            
            // 更新状态中的歌曲信息
            state.song.title = title;
            state.song.artist = artist;

            const title = document.getElementById('songTitleInput')?.value.trim();

            state.favorites[favId] = {

                song: JSON.parse(JSON.stringify(state.song)),

            state.currentChartName = name;

        // Render piano key cover SVG - portrait style (Aria Folio inspired)
        function renderPianoCover(seed) {
            let hash = 0;
            if (seed) {
                for (let i = 0; i < seed.length; i++) {
                    hash = ((hash << 5) - hash) + seed.charCodeAt(i);
                    hash |= 0;
                }
            }
            // Palette variants based on hash
            const palettes = [
                { bg1: '#2a2a35', bg2: '#0f0f14', accent: '#d4a574', text: '#f5f0e8' },
                { bg1: '#1e2a2e', bg2: '#0a1214', accent: '#7d9a8c', text: '#e8e4d8' },
                { bg1: '#2d1e2e', bg2: '#120a14', accent: '#c77d8e', text: '#f5e8ec' },
                { bg1: '#26262e', bg2: '#0e0e12', accent: '#a89968', text: '#ece6d4' },
                { bg1: '#1a2430', bg2: '#081018', accent: '#8aa6c2', text: '#d8e4ec' },
            ];
            const p = palettes[Math.abs(hash) % palettes.length];

            // Piano keys - 1 octave visible, keys from bottom up
            const keyCount = 8;
            const kbw = 100 / keyCount;
            const keyHeight = 55;
            const topY = 100 - keyHeight;
            const whiteKeyPositions = [];
            for (let i = 0; i < keyCount; i++) whiteKeyPositions.push(i * kbw);
            const blackKeyPositions = [0.65, 1.65, 3.65, 4.65, 5.65];
            const blackKeyHeight = keyHeight * 0.62;

            // White keys
            let whiteKeys = '';
            for (let i = 0; i < keyCount; i++) {
                const isHighlight = i === (Math.abs(hash) % keyCount);
                const fill = isHighlight ? p.accent : '#f0e8d8';
                const stroke = isHighlight ? p.accent : '#8a7a5a';
                whiteKeys += `<rect x="${i * kbw}" y="${topY}" width="${kbw}" height="${keyHeight}" fill="${fill}" stroke="${stroke}" stroke-width="0.2" opacity="${isHighlight ? 0.95 : 0.9}"/>`;
                // Top highlight on white keys
                whiteKeys += `<rect x="${i * kbw + 0.5}" y="${topY + 1}" width="${kbw - 1}" height="2" fill="#fff" opacity="0.5"/>`;
            }

            // Black keys
            let blackKeys = '';
            for (const pos of blackKeyPositions) {
                const x = pos * kbw;
                const isHl = Math.abs(hash >> 3) % 5 === blackKeyPositions.indexOf(pos);
                blackKeys += `<rect x="${x}" y="${topY}" width="${kbw * 0.6}" height="${blackKeyHeight}" fill="${isHl ? p.accent : '#0a0a0f'}" stroke="#000" stroke-width="0.15"/>`;
                blackKeys += `<rect x="${x + 0.5}" y="${topY + 1}" width="${kbw * 0.6 - 1}" height="2" fill="#fff" opacity="0.2"/>`;
            }

            // Fret lines / strings for decoration (subtle)
            let strings = '';
            for (let i = 0; i < 6; i++) {
                const y = topY - 3 - i * 1.2;
                strings += `<line x1="0" y1="${y}" x2="100" y2="${y}" stroke="${p.accent}" stroke-width="0.08" opacity="${0.15 - i * 0.015}"/>`;
            }

            return `<svg viewBox="0 0 100 133" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="coverBg${Math.abs(hash) % 1000}" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="${p.bg1}"/>
                        <stop offset="65%" stop-color="${p.bg2}"/>
                        <stop offset="100%" stop-color="#050508"/>
                    </linearGradient>
                    <radialGradient id="coverGlow${Math.abs(hash) % 1000}" cx="50%" cy="40%" r="50%">
                        <stop offset="0%" stop-color="${p.accent}" stop-opacity="0.18"/>
                        <stop offset="100%" stop-color="${p.accent}" stop-opacity="0"/>
                    </radialGradient>
                </defs>
                <rect x="0" y="0" width="100" height="133" fill="url(#coverBg${Math.abs(hash) % 1000})"/>
                <rect x="0" y="0" width="100" height="133" fill="url(#coverGlow${Math.abs(hash) % 1000})"/>
                ${strings}
                <!-- Center decorative circle/label area (top 65%) -->
                <g transform="translate(50, 48)">
                    <circle cx="0" cy="0" r="22" fill="none" stroke="${p.accent}" stroke-width="0.15" opacity="0.4"/>
                    <circle cx="0" cy="0" r="16" fill="none" stroke="${p.accent}" stroke-width="0.1" opacity="0.25"/>
                    <text x="0" y="-5" text-anchor="middle" font-family="Playfair Display, serif" font-size="5" fill="${p.accent}" opacity="0.7" letter-spacing="2">PIANO</text>
                    <line x1="-12" y1="0" x2="12" y2="0" stroke="${p.accent}" stroke-width="0.15" opacity="0.4"/>
                    <text x="0" y="8" text-anchor="middle" font-family="Playfair Display, serif" font-style="italic" font-size="3.5" fill="${p.text}" opacity="0.6">— chord chart —</text>
                </g>
                <!-- Piano keys at bottom -->
                ${whiteKeys}
                ${blackKeys}
                <!-- Thin bottom border -->
                <rect x="0" y="131" width="100" height="2" fill="${p.accent}" opacity="0.3"/>
            </svg>`;
        }

        // Render favorites list
        function renderFavoritesList() {
            const list = document.getElementById('favoritesList');
            const charts = Object.values(state.favorites).sort((a, b) => b.updatedAt - a.updatedAt);

            if (charts.length === 0) {
                list.innerHTML = `<div class="empty-favorites">还没有图谱<br>在编辑图谱后通过主菜单"保存图谱"来添加</div>`;
                return;
            }

            list.innerHTML = charts.map(chart => `
                <div class="favorite-item" data-id="${chart.id}">
                    <div class="favorite-info">
                        <div class="favorite-title">${escapeHtml(chart.name)}</div>
                        <div class="favorite-meta">
                            ${escapeHtml(chart.song.artist || '未知')} · ${chart.song.lyrics.length} 行
                            · 更新于 ${formatDate(chart.updatedAt)}
                        </div>
                    </div>
                    <div class="favorite-actions">
                        <button class="favorite-action-btn" data-action="load" data-id="${chart.id}">打开</button>
                        <button class="favorite-action-btn delete" data-action="delete" data-id="${chart.id}">删除</button>
                    </div>
                </div>
            `).join('');

            // Bind buttons
            list.querySelectorAll('.favorite-action-btn').forEach(btn => {
                btn.addEventListener('click', e => {
                    e.stopPropagation();
                    const action = btn.dataset.action;
                    const id = btn.dataset.id;
                    if (action === 'load') {
                        loadLocalChart(id);
                    } else if (action === 'delete') {
                        deleteChart(id);
                    }
                });
            });
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        // Load chart from favorites
        function loadLocalChart(id) {
            const chart = state.favorites[id];
            if (!chart) return;

            if (state.isDirty && !confirm('当前图谱有未保存的修改，确定要切换吗？')) return;

            state.song = JSON.parse(JSON.stringify(chart.song));
            state.chordData = JSON.parse(JSON.stringify(chart.chordData));
            state.displayMode = chart.displayMode || 'name';
            state.currentChartId = chart.id;
            state.currentChartName = chart.name;
            state.isDirty = false;
            state.isReadOnly = false;
            state.lastSource = 'my';
            state.chartAuthor = null;

            // Update mode toggle UI
            document.querySelectorAll('.mode-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.mode === state.displayMode);
            });

            closeFavoritesDialog();
            setNavActive('my');
            enterChartView();
            updateSongInfo();
            renderLyrics();
            updateSummary();
            updateSaveMenuText();
            saveToStorage();
        }

        // Delete chart from favorites
        function deleteChart(id) {
            const chart = state.favorites[id];
            if (!chart) return;
            if (!confirm(`确定要删除图谱"${chart.name}"吗？此操作不可恢复。`)) return;
            delete state.favorites[id];
            if (state.currentChartId === id) {
                state.currentChartId = null;
                state.currentChartName = null;
            }
            updateFavCount();
            updateSaveMenuText();
            saveToStorage();
            renderFavoritesList();
        }

        // Initialize auth state from localStorage
        function initAuth() {
            const savedToken = safeGet('authToken');
            const savedUser = safeGet('currentUser');
            if (savedToken && savedUser) {
                authToken = savedToken;
                try {
                    currentUser = JSON.parse(savedUser);
                    updateNavUI();
                    // Verify token is still valid
                    apiRequest('/api/auth/me').then(user => {
                        currentUser = user;
                        safeSet('currentUser', JSON.stringify(user));
                        updateNavUI();
                    }).catch(() => {
                        logout();
                    });
                } catch (e) {
                    logout();
                }
            }
        }

        // Update navigation UI based on auth state
        function updateNavUI() {
            const authDiv = document.getElementById('navAuth');
            const userDiv = document.getElementById('navUser');
            const usernameSpan = document.getElementById('navUsername');
            const publishLocalBtn = document.querySelector('[data-action="publishLocal"]');
            if (authToken && currentUser) {
                authDiv.style.display = 'none';
                userDiv.style.display = 'flex';
                usernameSpan.textContent = currentUser.username;
                if (publishLocalBtn) publishLocalBtn.style.display = 'flex';
            } else {
                authDiv.style.display = 'flex';
                userDiv.style.display = 'none';
                usernameSpan.textContent = '';
                if (publishLocalBtn) publishLocalBtn.style.display = 'none';
            }
        }

        function closeUserMenu() {
            var toggle = document.getElementById('navUserToggle');
            var menu = document.getElementById('navUserMenu');
            if (toggle) toggle.classList.remove('active');
            if (menu) menu.classList.remove('visible');
        }

        function logout() {
            authToken = null;
            currentUser = null;
            safeDel('authToken');
            safeDel('currentUser');
            closeUserMenu();
            updateNavUI();
            switchPage('home');
        }

        // Open login modal
        function openLoginModal() {
            document.getElementById('loginError').textContent = '';
            document.getElementById('loginUsername').value = '';
            document.getElementById('loginPassword').value = '';
            document.getElementById('loginModal').classList.add('visible');
        }
        function closeLoginModal() {
            document.getElementById('loginModal').classList.remove('visible');
        }

        // Open register modal
        function openRegisterModal() {
            document.getElementById('registerError').textContent = '';
            document.getElementById('regUsername').value = '';
            document.getElementById('regPassword').value = '';
            document.getElementById('regPassword2').value = '';
            document.getElementById('registerModal').classList.add('visible');
        }
        function closeRegisterModal() {
            document.getElementById('registerModal').classList.remove('visible');
        }

        // Switch between login and register modals
        function switchToRegister() {
            closeLoginModal();
            openRegisterModal();
        }
        function switchToLogin() {
            closeRegisterModal();
            openLoginModal();
        }

        // Perform login
        async function performLogin() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errorEl = document.getElementById('loginError');
            if (!username || !password) { errorEl.textContent = '请输入用户名和密码'; return; }
            try {
                const data = await apiRequest('/api/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ username, password })
                });
                authToken = data.token;
                currentUser = { userId: data.userId, username: data.username };
                safeSet('authToken', data.token);
                safeSet('currentUser', JSON.stringify(currentUser));
                closeLoginModal();
                updateNavUI();
                loadMyCharts();
            } catch (e) {
                errorEl.textContent = e.message;
            }
        }

        // Perform register
        async function performRegister() {
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const password2 = document.getElementById('regPassword2').value;
            const errorEl = document.getElementById('registerError');
            if (!username || !password) { errorEl.textContent = '请填写所有字段'; return; }
            if (password !== password2) { errorEl.textContent = '两次密码输入不一致'; return; }
            if (password.length < 6) { errorEl.textContent = '密码长度至少6个字符'; return; }
            try {
                const data = await apiRequest('/api/auth/register', {
                    method: 'POST',
                    body: JSON.stringify({ username, password })
                });
                authToken = data.token;
                currentUser = { userId: data.userId, username: data.username };
                safeSet('authToken', data.token);
                safeSet('currentUser', JSON.stringify(currentUser));
                closeRegisterModal();
                updateNavUI();
                loadMyCharts();
            } catch (e) {
                errorEl.textContent = e.message;
            }
        }

        let currentPage = 'home';

        function switchPage(page) {
            currentPage = page;
            document.getElementById('pageHome').style.display = page === 'home' ? 'block' : 'none';
            document.getElementById('pageMy').style.display = page === 'my' ? 'block' : 'none';
            document.getElementById('pageEditor').style.display = page === 'editor' ? 'block' : 'none';
            // 更新 Nav active 状态（预览页时不切换 nav active，保持原页面高亮）
            if (page !== 'editor') {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.page === page));
            }
            if (page === 'home') loadPublicCharts();
            if (page === 'my') loadMyCharts();
        }

        function setNavActive(page) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.page === page));
        }

        async function loadMyCharts() {
            const list = document.getElementById('myChartList');
            if (!authToken) {
                list.innerHTML = '<div class="empty-list"><div class="empty-list-icon">🔐</div>请先登录后查看我的图谱</div>';
                return;
            }
            try {
                const charts = await apiRequest('/api/charts/my');
                if (charts.length === 0) {
                    list.innerHTML = '<div class="empty-list"><div class="empty-list-icon">📝</div>还没有图谱，去首页创作吧！</div>';
                    return;
                }
                list.innerHTML = charts.map(c => {
                    return `
                    <div class="grid-card library-card" onclick="loadChart('${c.id}', 'my')">
                        <div class="library-cover">
                            ${renderPianoCover(c.id)}
                            <span class="library-level ${c.is_public ? 'public' : 'private'}">${c.is_public ? 'PUBLIC' : 'PRIVATE'}</span>
                        </div>
                        <div class="library-info">
                            <div class="library-title-row">
                                <div class="library-card-title">${escapeHtml(c.name)}</div>
                                <div class="card-menu" onclick="event.stopPropagation(); toggleCardMenu('${c.id}')">
                                    <button class="card-menu-btn" data-chart-id="${c.id}" aria-label="更多操作">⋯</button>
                                    <div class="card-menu-dropdown" id="cardMenu-${c.id}">
                                        <button onclick="event.stopPropagation(); togglePublic('${c.id}', ${!c.is_public}); closeCardMenus();">
                                            ${c.is_public ? '取消发布' : '发布到首页'}
                                        </button>
                                        <button class="card-menu-danger" onclick="event.stopPropagation(); confirmDeleteChart('${c.id}', '${escapeHtml(c.name).replace(/'/g, "\\'")}')">
                                            删除
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <div class="library-card-artist">${escapeHtml(c.song_artist || '—')}</div>
                            <div class="library-tags">
                                <span class="tag-pill">${formatDate(c.updated_at)}</span>
                            </div>
                        </div>
                    </div>
                    `;
                }).join('');
            } catch (e) {
                list.innerHTML = '<div class="empty-list"><div class="empty-list-icon">🌐</div>暂无图谱</div>';
            }
        }

        async function togglePublic(id, isPublic) {
            try {
                await apiRequest('/api/charts/my/' + id + '/public', {
                    method: 'PUT',
                    body: JSON.stringify({ is_public: isPublic })
                });
                loadMyCharts();
                if (isPublic) loadPublicCharts();
            } catch (e) { alert(e.message); }
        }

        /* 三点菜单切换 */
        function toggleCardMenu(id) {
            const menu = document.getElementById('cardMenu-' + id);
            const isActive = menu && menu.classList.contains('active');
            closeCardMenus();
            if (menu && !isActive) {
                menu.classList.add('active');
            }
        }

        function closeCardMenus() {
            document.querySelectorAll('.card-menu-dropdown.active').forEach(el => {
                el.classList.remove('active');
            });
        }

        /* 删除确认 */
        let pendingDeleteChartId = null;
        let pendingDeleteChartName = '';

        function confirmDeleteChart(id, name) {
            pendingDeleteChartName = name;
            pendingDeleteChartId = id;
            const modal = document.getElementById('deleteConfirmModal');
            const titleEl = document.getElementById('deleteConfirmName');
            if (titleEl) titleEl.textContent = name;
            if (modal) modal.style.display = 'flex';
            closeCardMenus();
        }

        function cancelDeleteChart() {
            pendingDeleteChartId = null;
            pendingDeleteChartName = '';
            const modal = document.getElementById('deleteConfirmModal');
            if (modal) modal.style.display = 'none';
        }

        async function doDeleteChart() {
            if (!pendingDeleteChartId) return;
            const id = pendingDeleteChartId;
            cancelDeleteChart();
            try {
                await apiRequest('/api/charts/my/' + id, { method: 'DELETE' });
                loadMyCharts();
            } catch (e) { alert(e.message); }
        }

        async function deleteChart(id) {
            if (!confirm('确定要删除这条图谱吗？')) return;
            try {
                await apiRequest('/api/charts/my/' + id, { method: 'DELETE' });
                loadMyCharts();
            } catch (e) { alert(e.message); }
        }

        async function loadChart(id, source) {
            try {
                const chart = await apiRequest('/api/charts/' + source + '/' + id);
                chart._source = source;
                state.lastSource = source === 'my' ? 'my' : 'home';
                // 我的图谱卡片 → 可编辑；首页公共卡片 → 只读
                openChartForEditing(chart, source === 'my' ? false : true);
            } catch (e) { alert(e.message); }
        }

        function openChartForEditing(chart, isReadOnly = false) {
            if (state.isDirty && !confirm('当前图谱有未保存的修改，确定要切换吗？')) return;

            // 查找是否已有对应的本地favorite（通过serverId或名称匹配）
            let localId = null;
            for (const fid of Object.keys(state.favorites)) {
                const f = state.favorites[fid];
                if (f.serverId === chart.id || f.name === chart.name) {
                    localId = fid;
                    break;
                }
            }
            if (!localId) localId = generateId();

            // Load chart data into state
            state.song = {
                title: chart.song_title || '',
                artist: chart.song_artist || '',
                lyrics: JSON.parse(chart.song_lyrics || '[]'),
                sections: JSON.parse(chart.song_sections || '{}')
            };
            state.chordData = JSON.parse(chart.chord_data || '{}');
            state.displayMode = chart.display_mode || 'name';
            state.currentChartId = localId;
            state.currentChartName = chart.name;
            state.isDirty = false;
            state.isReadOnly = isReadOnly; // 只读模式标志
            state.isNewChart = false; // 编辑已有图谱，不显示搜索栏
            state.chartAuthor = chart.author; // 保存作者信息

            // 同步本地favorite记录（关联serverId）
            state.favorites[localId] = {
                id: localId,
                name: chart.name,
                song: JSON.parse(JSON.stringify(state.song)),
                chordData: JSON.parse(JSON.stringify(state.chordData)),
                displayMode: state.displayMode,
                createdAt: Date.parse(chart.created_at) || Date.now(),
                updatedAt: Date.parse(chart.updated_at) || Date.now(),
                serverId: chart.id
            };

            // Update mode toggle UI
            document.querySelectorAll('.mode-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.mode === state.displayMode);
            });

            // 设置导航高亮（根据来源页面），然后进入编辑器视图
            setNavActive(chart._source === 'my' ? 'my' : 'home');
            enterChartView();
            updateSongInfo();
            renderLyrics();
            updateSummary();
            updateSaveMenuText();
            saveToStorage();
        }

        function enterChartView() {
            // 显示编辑器/详情视图，切换到 editor 页面
            const backBtn = document.getElementById('backFromChartBtn');
            const searchSection = document.getElementById('homeSearchSection');
            switchPage('editor');
            if (backBtn) {
                backBtn.style.display = 'inline-block';
                backBtn.textContent = state.lastSource === 'my' ? '← 返回我的图谱' : '← 返回首页';
            }
            // 仅新建图谱时显示搜索栏，编辑已有图谱时隐藏
            if (searchSection) {
                searchSection.classList.toggle('readonly-hidden', !state.isNewChart);
            }
        }

        function exitChartView() {
            // 退出编辑器视图，返回来源页面
            stopAutoScroll(); // 停止自动翻谱
            const backBtn = document.getElementById('backFromChartBtn');
            const searchSection = document.getElementById('homeSearchSection');
            const targetPage = state.lastSource || 'home';
            switchPage(targetPage);
            if (backBtn) backBtn.style.display = 'none';
            if (searchSection) searchSection.classList.remove('readonly-hidden');
            state.isReadOnly = false;
            state.isNewChart = false;
            state.chartAuthor = null;
        }

        async function openChartEditor() {
            // 点击"新建图谱"：重置状态，进入编辑器视图
            if (state.isDirty) {
                const confirmed = await showConfirmDialog('确认新建', '当前图谱有未保存的修改，确定要重新开始吗？');
                if (!confirmed) return;
            }
            state.song = { title: '', artist: '', lyrics: [''], sections: {} }; // 默认1行空歌词
            state.chordData = {};
            state.currentChartId = null;  // 重置当前图谱ID
            state.currentChartName = null; // 重置当前图谱名称
            state.isDirty = false;
            state.isReadOnly = false;
            state.isNewChart = true;
            state.chartAuthor = null;
            state.lastSource = 'my';
            setNavActive('my');
            enterChartView();
            updateSongInfo();
            renderLyrics();
            updateSummary();
        }

        function showGridView() {
            // 显式切换到首页网格视图
            switchPage('home');
        }

        async function loadPublicCharts() {
            const list = document.getElementById('homeChartList');
            const metaEl = document.getElementById('galleryCountNum');
            const countAll = document.getElementById('countAll');
            try {
                const charts = await apiRequest('/api/charts/public');
                if (charts.length === 0) {
                    list.innerHTML = '<div class="empty-list"><div class="empty-list-icon">🌐</div>暂无公共图谱</div>';
                    if (metaEl) metaEl.textContent = '0';
                    return;
                }
                if (metaEl) metaEl.textContent = charts.length.toString();
                if (countAll) countAll.textContent = charts.length.toString();
                list.innerHTML = charts.map(c => `
                    <div class="grid-card" onclick="loadChart('${c.id}', 'public')">
                        <div class="grid-card-cover">
                            ${renderPianoCover(c.id)}
                        </div>
                        <div>
                            <div class="grid-card-title">${escapeHtml(c.name)}</div>
                            <div class="grid-card-meta">${escapeHtml(c.song_artist || 'Various')}</div>
                            <div class="grid-card-artist">@ ${escapeHtml(c.author)}</div>
                            <span class="grid-card-time">${formatDate(c.updated_at)}</span>
                            <div class="grid-card-actions">
                                ${authToken ? '<button class="grid-action-btn save" onclick="event.stopPropagation(); saveAsChart(\'' + c.id + '\')">SAVE</button>' : ''}
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                // 后端不可用时显示友好提示，不暴露技术细节
                list.innerHTML = '<div class="empty-list"><div class="empty-list-icon">🌐</div>暂无公共图谱</div>';
                if (metaEl) metaEl.textContent = '0';
            }
        }

        async function saveAsChart(publicId) {
            try {
                const chart = await apiRequest('/api/charts/public/' + publicId);
                const name = prompt('请输入图谱名称：', chart.name + ' (副本)');
                if (!name) return;
                await apiRequest('/api/charts/my', {
                    method: 'POST',
                    body: JSON.stringify({
                        name: name,
                        song: { title: chart.song_title, artist: chart.song_artist, lyrics: JSON.parse(chart.song_lyrics || '[]'), sections: JSON.parse(chart.song_sections || '{}') },
                        chord_data: JSON.parse(chart.chord_data || '{}'),
                        display_mode: chart.display_mode || 'name'
                    })
                });
                alert('已保存到我的图谱！');
                switchPage('my');
            } catch (e) { alert(e.message); }
        }

        let viewerChartData = null;

        function openChartViewer(chart, source) {
            viewerChartData = chart;
            viewerChartData._source = source;
            const titleEl = document.getElementById('viewChartTitle');
            const bodyEl = document.getElementById('viewChartBody');
            const isPublic = source === 'public';
            titleEl.textContent = chart.name;
            const lyrics = JSON.parse(chart.song_lyrics || '[]');
            const sections = JSON.parse(chart.song_sections || '{}');
            const chordData = JSON.parse(chart.chord_data || '{}');
            const displayMode = chart.display_mode || 'name';
            // Render lyrics with chords and section labels
            let lyricsHtml = lyrics.map((line, li) => {
                const chars = line.split('').map((ch, ci) => {
                    const key = ci + '_current';
                    const cd = chordData[li] && chordData[li][key] ? chordData[li][key] : null;
                    const chordHtml = cd && cd.chord ? `<span class="char-chord"><span class="fc-chord">${escapeHtml(cd.chord)}</span></span>` : '';
                    return `<span class="lyric-char"><span class="char-chord">${chordHtml}</span><span class="char-text">${ch === ' ' ? '&nbsp;' : escapeHtml(ch)}</span></span>`;
                }).join('');
                const sectionLabel = sections[li]
                    ? `<div class="line-section-label" style="margin-top:${li === 0 ? '0' : '24px'};margin-bottom:16px;">${escapeHtml(sections[li])}</div>`
                    : '';
                return `${sectionLabel}<div class="lyric-line" style="cursor:default"><span class="line-number">${li + 1}</span><div class="line-content">${chars}</div></div>`;
            }).join('');
            
            bodyEl.innerHTML = `
                <div class="chart-viewer-song">${escapeHtml(chart.song_title)}${chart.song_artist ? ' · ' + escapeHtml(chart.song_artist) : ''}</div>
                ${isPublic && chart.author ? '<div class="chart-viewer-author">作者：@' + escapeHtml(chart.author) + '</div>' : ''}
                <div style="margin-top:12px;display:flex;gap:6px;align-items:center">
                    <span style="font-size:0.75rem;color:var(--text-secondary)">显示模式：</span>
                    <button class="chart-action-btn" onclick="viewerSetMode('name')">和弦名</button>
                    <button class="chart-action-btn" onclick="viewerSetMode('tab')">弹唱标记</button>
                </div>
                <div style="margin-top:12px" id="viewerLyrics">${lyricsHtml}</div>
            `;
            document.getElementById('viewChartModal').classList.add('visible');
        }

        function viewerSetMode(mode) {
            viewerChartData.display_mode = mode;
            openChartViewer(viewerChartData, viewerChartData._source || 'public');
        }

        function closeViewChartModal() {
            document.getElementById('viewChartModal').classList.remove('visible');
        }

        // Sync current chart to server (when logged in)
        async function syncChartToServer(favoriteId) {
            if (!authToken) return;
            try {
                const fav = state.favorites[favoriteId];
                if (!fav) return;

                const payload = {
                    name: fav.name,
                    song: fav.song,
                    chord_data: fav.chordData,
                    display_mode: fav.displayMode
                };

                let result;
                const isNewChart = !fav.serverId;
                if (fav.serverId) {
                    await apiRequest('/api/charts/my/' + fav.serverId, {
                        method: 'PUT',
                        body: JSON.stringify(payload)
                    });
                    result = { id: fav.serverId };
                } else {
                    result = await apiRequest('/api/charts/my', {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                    fav.serverId = result.id;
                    saveToStorage();
                }

                // 更新成功后刷新我的图谱列表，确保更新时间正确
                if (typeof loadMyCharts === 'function' && document.getElementById('pageMy')?.style.display === 'block') {
                    loadMyCharts();
                }
                if (typeof loadPublicCharts === 'function' && currentPage === 'home') {
                    loadPublicCharts();
                }
                // 显示保存成功提示
                showToast(isNewChart ? '已保存到我的图谱！' : '图谱已更新！');
            } catch (e) {
                console.warn('Sync to server failed:', e.message);
                showToast('保存失败: ' + e.message, 3000);
            }
        }

        // Start
        init();
    </script>
</body>
</html>

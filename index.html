            <button class="btn btn-secondary" id="favoritesClose">关闭</button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast"><span id="toastMessage"></span></div>

    <script>
        // Application State
        const state = {
            song: { title: '', artist: '', lyrics: [], sections: {} },
            displayMode: 'name', // 'name' or 'tab'
            selectedChar: null,
            chordData: {}, // { lineIndex: { charIndex: { chord: 'C', left: '1', right: '135' } } }
            keyOffset: 0, // 转调半音数，0 = C调
            // 图谱管理相关
            currentChartId: null,      // 当前打开的图谱ID
            currentChartName: null,    // 当前图谱名称
            isDirty: false,            // 是否有未保存的修改
            isReadOnly: false,         // 只读模式（公共图谱，歌词不可编辑）
            isNewChart: false,         // 是否为新建图谱（true 显示搜索栏，false 隐藏）
            chartAuthor: null,         // 图谱作者（公共图谱）
            lastSource: 'home',        // 进入编辑器前的页面（'home' or 'my'）
            favorites: {}              // { id: { id, name, song, chordData, displayMode, createdAt, updatedAt } }
        };

        function safeGet(key) {
            try { return localStorage.getItem(key); } catch (e) { return null; }
        }
        function safeSet(key, val) {
            try { localStorage.setItem(key, val); } catch (e) {}
        }
        function safeDel(key) {
            try { localStorage.removeItem(key); } catch (e) {}
        }

        let authToken = safeGet('authToken') || null;
        let currentUser = null;

        // Auto scroll state (自动翻谱)
        let autoScrollTimer = null;
        let autoScrollActive = false;
        let autoScrollSpeedVal = 30;

        function startAutoScroll() {
            if (autoScrollTimer) clearInterval(autoScrollTimer);
            autoScrollActive = true;
            const btn = document.getElementById('autoScrollBtn');
            if (btn) {
                btn.textContent = '\u23F8';
                btn.classList.add('active');
            }
            autoScrollTimer = setInterval(() => {
                const atBottom = (window.innerHeight + window.scrollY) >= document.body.scrollHeight - 2;
                if (atBottom) {
                    stopAutoScroll();
                    return;
                }
                window.scrollBy(0, 1);
            }, autoScrollSpeedVal);
        }

        function stopAutoScroll() {
            if (autoScrollTimer) {
                clearInterval(autoScrollTimer);
                autoScrollTimer = null;
            }
            autoScrollActive = false;
            const btn = document.getElementById('autoScrollBtn');
            if (btn) {
                btn.textContent = '\u25B6';
                btn.classList.remove('active');
            }
        }

        // Chord Builder State
        const chordBuilderState = {
            root: null,
            accidental: 'none',
            quality: 'major',
            extensions: [],
            slash: null,
            inversion: 0 // 0 = 原位, 1 = 第一转位, 2 = 第二转位
        };

        // Confirm Dialog State
        let confirmCallback = null;

        // Panel position tracking (follows target element on scroll)
        let chordPanelTargetEl = null;

        // Which tab fields have been manually edited by user
        const tabEdited = { left: false, right: false };

        // 音名到半音位置映射
        const noteToSemitone = { 'C': 0, 'D': 2, 'E': 4, 'F': 5, 'G': 7, 'A': 9, 'B': 11 };
        
        // 半音到数字标记映射（含升降号）
        const semitoneToNumber = {
            0: '1', 1: '1#', 2: '2', 3: '2#', 4: '3', 5: '4', 6: '4#',
            7: '5', 8: '#5', 9: '6', 10: 'b7', 11: '7'
        };

        // 半音到音名映射（升号优先）
        const semitoneToNoteSharp = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        const semitoneToNoteFlat = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];

        // 解析音名（含升降号）为半音数
        function parseNoteToSemitone(noteStr) {
            if (!noteStr) return null;
            const match = noteStr.match(/^([A-G])([#b]?)/);
            if (!match) return null;
            const base = match[1];
            const accidental = match[2];
            let semitone = noteToSemitone[base];
            if (accidental === '#') semitone += 1;
            if (accidental === 'b') semitone -= 1;
            return (semitone + 12) % 12;
        }

        // 转调单个音名
        function transposeNote(noteStr, offset) {
            const semitone = parseNoteToSemitone(noteStr);
            if (semitone == null) return noteStr;
            const newSemitone = (semitone + offset + 12) % 12;
            const useFlat = noteStr.includes('b');
            return useFlat ? semitoneToNoteFlat[newSemitone] : semitoneToNoteSharp[newSemitone];
        }

        // 转调整个和弦名
        function transposeChordName(chordName, offset) {
            if (!chordName || offset === 0) return chordName;

            const slashMatch = chordName.match(/^(.+)\/([A-G][#b]?)$/);
            let mainPart = chordName;
            let bassNote = null;

            if (slashMatch) {
                mainPart = slashMatch[1];
                bassNote = slashMatch[2];
            }

            const rootMatch = mainPart.match(/^([A-G][#b]?)(.*)$/);
            if (!rootMatch) return chordName;

            const rootNote = rootMatch[1];
            const suffix = rootMatch[2];
            const newRoot = transposeNote(rootNote, offset);
            let result = newRoot + suffix;

            if (bassNote) {
                const newBass = transposeNote(bassNote, offset);
                result += '/' + newBass;
            }

            return result;
        }

        // 转调弹唱标记（数字）
        function transposeTabNumber(numStr, offset) {
            if (!numStr || offset === 0) return numStr;
            const numMap = { '1': 0, '2': 2, '3': 4, '4': 5, '5': 7, '6': 9, '7': 11 };
            const reverseMap = { 0: '1', 2: '2', 4: '3', 5: '4', 7: '5', 9: '6', 11: '7' };

            let result = '';
            let i = 0;
            while (i < numStr.length) {
                const ch = numStr[i];
                if (numMap[ch] != null) {
                    let semitone = numMap[ch];
                    let accidental = '';
                    if (i + 1 < numStr.length && (numStr[i + 1] === '#' || numStr[i + 1] === 'b')) {
                        accidental = numStr[i + 1];
                        semitone += accidental === '#' ? 1 : -1;
                        i++;
                    }
                    const newSemitone = (semitone + offset + 12) % 12;
                    const baseNote = reverseMap[newSemitone];
                    if (baseNote != null) {
                        result += baseNote;
                    } else {
                        const lower = newSemitone - 1;
                        const higher = (newSemitone + 1) % 12;
                        if (reverseMap[lower] != null) {
                            result += reverseMap[lower] + '#';
                        } else if (reverseMap[higher] != null) {
                            result += reverseMap[higher] + 'b';
                        } else {
                            result += ch + accidental;
                        }
                    }
                } else if (ch === '(' || ch === ')' || ch === '，' || ch === '、' || /\d/.test(ch)) {
                    result += ch;
                } else {
                    result += ch;
                }
                i++;
            }
            return result;
        }

        // 和弦性质音程结构（半音）
        const chordIntervals = {
            'major': [0, 4, 7],
            'minor': [0, 3, 7],
            '7': [0, 4, 7, 10],
            'maj7': [0, 4, 7, 11],
            'm7': [0, 3, 7, 10],
            'dim': [0, 3, 6],
            'dim7': [0, 3, 6, 9],
            'aug': [0, 4, 8],
            'sus2': [0, 2, 7],
            'sus4': [0, 5, 7]
        };

        // 扩展音半音偏移
        const extensionIntervals = {
            '9': 14, '11': 17, '13': 21,
            'add9': 14, 'add2': 2
        };

        // 获取和弦的最大转位数（3音和弦3个，4音和弦4个）
        function getMaxInversions(quality, extensions) {
            const fourNoteChords = ['7', 'maj7', 'm7', 'dim7'];
            if (fourNoteChords.includes(quality)) return 4;
            return 3;
        }

        // 计算弹唱标记
        function calculateChordTab(root, accidental, quality, extensions, slash, inversion) {
            if (!root) return { name: '-', left: '-', right: '-' };

            // 计算根音半音位置
            let rootSemitone = noteToSemitone[root];
            if (accidental === 'sharp') rootSemitone += 1;
            if (accidental === 'flat') rootSemitone -= 1;
            rootSemitone = (rootSemitone + 12) % 12;

            // 获取和弦音程（必须拷贝数组，避免直接修改 chordIntervals）
            let intervals = chordIntervals[quality]
                ? [...chordIntervals[quality]]
                : [...chordIntervals['major']];

            // 添加扩展音（先转换为半音，再检查是否与已有音重复）
            extensions.forEach(ext => {
                const interval = extensionIntervals[ext];
                if (interval == null) return;
                const normalizedInterval = interval % 12;
                const hasOverlap = intervals.some(i => i % 12 === normalizedInterval);
                if (!hasOverlap) {
                    intervals.push(interval);
                }
            });

            // 按音程从低到高排序（保持和弦构成顺序：1→3→5→7→9...）
            intervals.sort((a, b) => a - b);

            // 计算各音半音位置并转换为数字
            let notes = intervals.map(interval => {
                const semitone = (rootSemitone + interval) % 12;
                return semitoneToNumber[semitone];
            });

            // 左手：始终取原位第一音（根音），不受转位影响
            const leftHand = notes[0];

            // 转位处理：把前 `inversion` 个音移到后面
            const inv = inversion || 0;
            if (inv > 0 && inv < notes.length) {
                const moved = notes.slice(0, inv);
                notes = notes.slice(inv).concat(moved);
            }

            // 如果显式指定了 slash bass（斜杠和弦），用 slash 音做左手
            let left = leftHand;
            if (slash) {
                const slashSemitone = noteToSemitone[slash];
                left = semitoneToNumber[slashSemitone];
            }

            // 构建和弦名称
            let chordName = root;
            if (accidental === 'sharp') chordName += '#';
            if (accidental === 'flat') chordName += 'b';

            if (quality === 'minor') chordName += 'm';
            else if (quality === '7') chordName += '7';
            else if (quality === 'maj7') chordName += 'maj7';
            else if (quality === 'm7') chordName += 'm7';
            else if (quality === 'dim') chordName += 'dim';
            else if (quality === 'dim7') chordName += 'dim7';
            else if (quality === 'aug') chordName += 'aug';
            else if (quality === 'sus2') chordName += 'sus2';
            else if (quality === 'sus4') chordName += 'sus4';

            extensions.forEach(ext => {
                if (ext === 'add9' || ext === 'add2') {
                    chordName += ext;
                } else if (['9', '11', '13'].includes(ext)) {
                    if (quality === '7' || quality === 'm7' || quality === 'maj7') {
                        chordName = chordName.replace('7', ext);
                    } else {
                        chordName += ext;
                    }
                }
            });

            if (slash) chordName += '/' + slash;

            return {
                name: chordName,
                left: left,
                right: notes.join('')
            };
        }

        // 更新和弦预览（写入输入框）
        function updateChordPreview() {
            const result = calculateChordTab(
                chordBuilderState.root,
                chordBuilderState.accidental,
                chordBuilderState.quality,
                chordBuilderState.extensions,
                chordBuilderState.slash,
                chordBuilderState.inversion
            );

            document.getElementById('previewName').textContent = result.name;

            const leftInput = document.getElementById('tabLeftInput');
            const rightInput = document.getElementById('tabRightInput');

            // 只有未被用户手动编辑过的字段才自动更新
            if (!tabEdited.left) {
                leftInput.value = result.left === '-' ? '' : result.left;
                leftInput.classList.remove('edited');
            }
            if (!tabEdited.right) {
                rightInput.value = result.right === '-' ? '' : result.right;
                rightInput.classList.remove('edited');
            }

            // 更新转位按钮文字（动态标签：3音和弦3个，4音和弦4个）
            const maxInv = getMaxInversions(chordBuilderState.quality, chordBuilderState.extensions);
            const invLabels = [];
            for (let i = 0; i < maxInv; i++) {
                invLabels.push(i === 0 ? '原位' : i + '转');
            }
            const invBtn = document.getElementById('tabInversion');
            invBtn.textContent = invLabels[chordBuilderState.inversion] || '原位';
        }

        // 循环切换转位（根据和弦类型动态调整）
        function cycleInversion() {
            const maxInv = getMaxInversions(chordBuilderState.quality, chordBuilderState.extensions);
            chordBuilderState.inversion = (chordBuilderState.inversion + 1) % maxInv;
            // 转位切换后清除用户编辑的左右手标记，让系统自动计算
            tabEdited.left = false;
            tabEdited.right = false;
            updateChordPreview();
        }

        // 根据目标元素重新定位面板（滚动和缩放时调用）
        function repositionChordPanel() {
            if (!chordPanelTargetEl || !chordPanel.classList.contains('visible')) return;
            const rect = chordPanelTargetEl.getBoundingClientRect();
            const panelRect = chordPanel.getBoundingClientRect();

            let left = rect.left;
            let top = rect.bottom + 8;

            // 防止超出视口右侧
            if (left + panelRect.width > window.innerWidth - 8) {
                left = window.innerWidth - panelRect.width - 8;
            }
            // 防止超出视口左侧
            if (left < 8) left = 8;

            // 如果下方空间不够，显示在元素上方
            if (top + panelRect.height > window.innerHeight - 8) {
                top = rect.top - panelRect.height - 8;
                if (top < 8) top = 8;
            }

            chordPanel.style.left = `${left}px`;
            chordPanel.style.top = `${top}px`;
        }

        // 弹唱标记输入框变化（用户手动修改）
        function onTabInput(field) {
            tabEdited[field] = true;
            document.getElementById(field === 'left' ? 'tabLeftInput' : 'tabRightInput').classList.add('edited');
        }

        // 重置弹唱标记为默认自动计算值
        function resetTabToDefault() {
            tabEdited.left = false;
            tabEdited.right = false;
            updateChordPreview();
        }

        // 更新转位选项
        function updateSlashOptions() {
            const root = chordBuilderState.root;
            if (!root) {
                document.getElementById('slashSection').style.display = 'none';
                return;
            }
            
            const slashSection = document.getElementById('slashSection');
            const slashGroup = document.getElementById('slashGroup');
            
            const allNaturalNotes = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
            const options = allNaturalNotes.filter(note => note !== root);
            
            slashGroup.innerHTML = `<button class="slash-btn selected" data-slash="none">无转位</button>` +
                options.map(note => `<button class="slash-btn" data-slash="${note}">${root}/${note}</button>`).join('');
            
            slashSection.style.display = 'block';
        }

        // 重置和弦构建器
        function resetChordBuilder() {
            chordBuilderState.root = null;
            chordBuilderState.accidental = 'none';
            chordBuilderState.quality = 'major';
            chordBuilderState.extensions = [];
            chordBuilderState.slash = null;
            chordBuilderState.inversion = 0;
            tabEdited.left = false;
            tabEdited.right = false;

            // 重置UI
            document.querySelectorAll('#rootGroup .chord-btn').forEach(b => b.classList.remove('selected'));
            document.querySelectorAll('#accidentalGroup .chord-btn').forEach(b => b.classList.remove('selected'));
            document.querySelectorAll('#qualityGroup .chord-btn').forEach(b => b.classList.remove('selected'));
            document.querySelectorAll('#extensionGroup .chord-btn').forEach(b => b.classList.remove('selected'));

            document.querySelector('#accidentalGroup [data-accidental="none"]').classList.add('selected');
            document.querySelector('#qualityGroup [data-quality="major"]').classList.add('selected');

            document.getElementById('slashSection').style.display = 'none';
            document.getElementById('tabLeftInput').value = '';
            document.getElementById('tabRightInput').value = '';
            document.getElementById('tabLeftInput').classList.remove('edited');
            document.getElementById('tabRightInput').classList.remove('edited');
            updateChordPreview();
        }

        // Section Tags
        const sectionTags = ['主歌A', '主歌B', '主歌C', '副歌A', '副歌B', '副歌C', '过渡段', '间奏', '尾奏', '前奏'];

        // DOM Elements
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const manualBtn = document.getElementById('manualBtn');
        const lyricsContainer = document.getElementById('lyricsContainer');
        const chordPanel = document.getElementById('chordPanel');
        const songInfo = document.getElementById('songInfo');
        const chordSummary = document.getElementById('chordSummary');
        const summaryGrid = document.getElementById('summaryGrid');
        const manualModal = document.getElementById('manualModal');

        // ============== Utility Functions ==============

        // API utility
        async function apiRequest(url, options = {}) {
            const headers = { 'Content-Type': 'application/json' };
            if (authToken) headers['Authorization'] = 'Bearer ' + authToken;
            let res;
            try {
                res = await fetch(url, { ...options, headers: { ...headers, ...(options.headers || {}) } });
            } catch (err) {
                throw new Error('网络连接失败，请检查网络或稍后重试');
            }
            const contentType = res.headers.get('content-type') || '';
            const isJson = contentType.includes('application/json');
            let data = isJson ? await res.json() : null;
            if (res.ok && isJson) return data;
            if (res.status === 401) throw new Error((data && data.error) || '未登录或登录已过期');
            if (res.status === 404) throw new Error((data && data.error) || '请求失败 (404)');
            if (res.status >= 500) throw new Error((data && data.error) || '服务器错误，请稍后重试');
            if (isJson && data && data.error) throw new Error(data.error);
            throw new Error('请求失败，请稍后重试');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            return (d.getMonth()+1) + '月' + d.getDate() + '日';
        }

        // Generate UUID
        function generateId() {
            return 'chart_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
        }

        // Format date
        function formatDate(ts) {
            const d = new Date(ts);
            const pad = n => n.toString().padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        // Mark dirty when changes happen
        function markDirty() {
            if (!state.isDirty) {
                state.isDirty = true;
                if (typeof updateSaveMenuText === 'function') updateSaveMenuText();
            }
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        // Initialize
        function init() {
            bindEvents();
            loadFromStorage();
            updateFavCount();
            updateSaveMenuText();
            initAuth();
            loadPublicCharts();
        }

        // Bind events
        function bindEvents() {
            // Search
            searchBtn.addEventListener('click', searchSong);
            searchInput.addEventListener('keypress', e => e.key === 'Enter' && searchSong());

            // Song title and artist input change
            document.getElementById('songTitleInput')?.addEventListener('input', function() {
                state.song.title = this.value;
                markDirty();
            });
            document.getElementById('songArtistInput')?.addEventListener('input', function() {
                state.song.artist = this.value;
                markDirty();
            });

            // Mode toggle
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    state.displayMode = btn.dataset.mode;
                    renderLyrics();
                    updateSummary();
                });
            });

            // Key selector (调式选择)
            const keySelect = document.getElementById('keySelect');
            if (keySelect) {
                keySelect.addEventListener('change', function() {
                    state.keyOffset = parseInt(this.value) || 0;
                    renderLyrics();
                    updateSummary();
                });
            }

            // Auto scroll (自动翻谱) - 事件绑定
            const autoScrollBtn = document.getElementById('autoScrollBtn');
            const autoScrollSpeedEl = document.getElementById('autoScrollSpeed');

            if (autoScrollBtn) {
                autoScrollBtn.addEventListener('click', () => {
                    if (autoScrollActive) {
                        stopAutoScroll();
                    } else {
                        startAutoScroll();
                    }
                });
            }

            if (autoScrollSpeedEl) {
                autoScrollSpeedEl.addEventListener('change', function() {
                    autoScrollSpeedVal = parseInt(this.value) || 30;
                    if (autoScrollActive) {
                        startAutoScroll(); // 重启以应用新速度
                    }
                });
            }

            // 用户手动滚动时暂停自动翻谱
            let autoScrollLastY = window.scrollY;
            window.addEventListener('scroll', () => {
                if (!autoScrollActive) return;
                const delta = Math.abs(window.scrollY - autoScrollLastY);
                // 自动翻谱每次只滚动 1px，如果偏差过大说明是用户手动滚动
                if (delta > 5) {
                    stopAutoScroll();
                }
                autoScrollLastY = window.scrollY;
            }, { passive: true });

            // Chord panel
            document.getElementById('panelClose').addEventListener('click', closeChordPanel);
            document.getElementById('chordConfirm').addEventListener('click', confirmChord);
            document.getElementById('chordDelete').addEventListener('click', deleteChord);

            // Confirm dialog
            document.getElementById('confirmOk').addEventListener('click', confirmDialogOk);
            document.getElementById('confirmCancel').addEventListener('click', confirmDialogCancel);

            // Tab inputs (user-editable)
            document.getElementById('tabLeftInput').addEventListener('input', () => onTabInput('left'));
            document.getElementById('tabRightInput').addEventListener('input', () => onTabInput('right'));
            document.getElementById('tabReset').addEventListener('click', resetTabToDefault);

            // 转位按钮：原位 → 第一转位 → 第二转位 → 原位 循环
            document.getElementById('tabInversion').addEventListener('click', cycleInversion);

            // Chord Builder - Root selection
            document.getElementById('rootGroup').addEventListener('click', e => {
                const btn = e.target.closest('.chord-btn');
                if (!btn) return;
                document.querySelectorAll('#rootGroup .chord-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                chordBuilderState.root = btn.dataset.root;
                updateChordPreview();
                updateSlashOptions();
            });

            // Chord Builder - Accidental selection
            document.getElementById('accidentalGroup').addEventListener('click', e => {
                const btn = e.target.closest('.chord-btn');
                if (!btn) return;
                document.querySelectorAll('#accidentalGroup .chord-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                chordBuilderState.accidental = btn.dataset.accidental;
                updateChordPreview();
                updateSlashOptions();
            });

            // Chord Builder - Quality selection
            document.getElementById('qualityGroup').addEventListener('click', e => {
                const btn = e.target.closest('.chord-btn');
                if (!btn) return;
                document.querySelectorAll('#qualityGroup .chord-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                chordBuilderState.quality = btn.dataset.quality;

        // Search song (using backend music search API)
        async function searchSong() {
            const query = searchInput.value.trim();
            if (!query) return;

            searchBtn.innerHTML = '<span>🔍</span> 搜索中...';
            searchBtn.disabled = true;

            // 显示搜索结果弹窗（加载状态）
            const searchResultsModal = document.getElementById('searchResultsModal');
            const searchResultsContent = document.getElementById('searchResultsContent');
            searchResultsContent.innerHTML = '<div class="search-result-loading">正在搜索...</div>';
            searchResultsModal.classList.add('visible');

            try {
                // 同时调用音乐搜索 API 和和弦搜索 API
                const [musicResponse, chordsResponse] = await Promise.all([
                    fetch(`/api/music/search?q=${encodeURIComponent(query)}`),
                    fetch(`/api/chords/search?q=${encodeURIComponent(query)}`)
                ]);

                // 获取歌词搜索结果
                const musicData = musicResponse.ok ? await musicResponse.json() : { songs: [] };
                // 获取和弦搜索结果
                const chordsData = chordsResponse.ok ? await chordsResponse.json() : { songs: [] };

                // 合并结果（有和弦的数据优先显示）
                const songs = [];
                const seenTitles = new Set();

                // 先添加有和弦的歌曲
                chordsData.songs.forEach(song => {
                    if (!seenTitles.has(song.title)) {
                        seenTitles.add(song.title);
                        songs.push({ ...song, hasChords: true });
                    }
                });

                // 再添加无和弦的歌曲
                musicData.songs.forEach(song => {
                    if (!seenTitles.has(song.name)) {
                        seenTitles.add(song.name);
                        songs.push({ ...song, title: song.name, hasChords: false });
                    }
                });

                if (songs.length === 0) {
                    searchResultsContent.innerHTML = '<div class="search-result-empty">未找到相关歌曲，请尝试其他关键词</div>';
                    return;
                }

                // 渲染搜索结果列表
                renderSearchResults(songs);
            } catch (error) {
                searchResultsContent.innerHTML = `<div class="search-result-empty">${escapeHtml(error.message)}</div>`;
            } finally {
                searchBtn.innerHTML = '<span>🔍</span> 搜索';
                searchBtn.disabled = false;
            }
        }

        // 选择歌曲并获取歌词/和弦
        async function selectSong(songId, songName, songArtist, hasChords) {
            const searchResultsContent = document.getElementById('searchResultsContent');
            searchResultsContent.innerHTML = '<div class="search-result-loading">正在获取歌曲信息...</div>';

            try {
                // 如果有和弦数据，优先从和弦数据库获取
                if (hasChords) {
                    const chordsResponse = await fetch(`/api/chords/detail?title=${encodeURIComponent(songName)}`);
                    if (chordsResponse.ok) {
                        const chordsData = await chordsResponse.json();
                        
                        // 填充到 state.song（使用数据库中的歌词和和弦）
                        state.song = {
                            title: chordsData.title,
                            artist: chordsData.artist,
                            lyrics: chordsData.lyrics || [],
                            sections: chordsData.sections || {}
                        };
                        
                        // 将和弦数据填充到 state.chordData
                        state.chordData = {};
                        let lineIndex = 0;
                        Object.values(chordsData.sections || {}).forEach(chords => {
                            chords.forEach((chord, i) => {
                                if (!state.chordData[lineIndex]) {
                                    state.chordData[lineIndex] = {};
                                }
                                // 将和弦放在每行的第一个位置
                                state.chordData[lineIndex][`chord_${i}`] = {
                                    chord: chord,
                                    left: '1',
                                    right: '1',
                                    position: 'current'
                                };
                                if (i % 4 === 3) lineIndex++; // 每4个和弦换一行
                            });
                            lineIndex++;
                        });
                        
                        // 关闭弹窗并更新 UI
                        document.getElementById('searchResultsModal').classList.remove('visible');
                        updateSongInfo();
                        renderLyrics();
                        updateSummary();
                        updateSaveMenuText();
                        saveToStorage();
                        // 有和弦数据时不显示 AI 按钮
                        document.getElementById('aiChordAnalyzer').style.display = 'none';
                        return;
                    }
                }

                // 如果没有和弦或获取失败，尝试获取歌词
                const response = await fetch(`/api/music/lyric?id=${encodeURIComponent(songId)}`);
                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.error || '获取歌词失败');
                }

                const data = await response.json();
                if (!data.lyric) {
                    throw new Error('该歌曲暂无歌词');
                }

                // 解析 LRC 格式歌词
                const lyrics = parseLrcLyric(data.lyric);

                // 填充到 state.song
                state.song = {
                    title: songName,
                    artist: songArtist,
                    lyrics: lyrics,
                    sections: {}
                };
                state.chordData = {};
                state.currentChartId = null;
                state.currentChartName = null;
                state.isDirty = false;

                // 关闭弹窗

                // 更新 UI
                updateSongInfo();
                renderLyrics();
                updateSummary();
                updateSaveMenuText();
                saveToStorage();
                
                // 显示 AI 和弦分析按钮（没有和弦数据时显示）
                document.getElementById('aiChordAnalyzer').style.display = 'block';
            } catch (error) {
                searchResultsContent.innerHTML = `<div class="search-result-empty">${escapeHtml(error.message)}</div>`;
            }
        }

        // 解析 LRC 格式歌词，去除时间标签
        function parseLrcLyric(lrcText) {
            return lrcText.split('\n')
                .map(line => {
                    // 去除所有时间标签 [mm:ss.xx] 或 [mm:ss]
                    return line.replace(/\[\d{2}:\d{2}(\.\d{2,3})?\]/g, '').trim();
                })
                .filter(line => {
                    // 过滤空行和元数据行（如歌曲名、歌手名等）
                    if (line.length === 0) return false;
                    // 过滤纯元数据行（如 "晴天 - 呼杰伦" 这种标题行）
                    if (line.match(/^.{1,30}\s*-\s*.{1,30}$/) && !line.match(/[a-zA-Z\u4e00-\u9fa5]{3,}/)) {
                        // 如果是 "歌名 - 歌手" 格式且没有实际歌词内容，跳过
                        return false;
                    }
                    return true;
                });
        }

        // 应用 AI 和弦分析结果
        function applyAIChordAnalysis(songData, analysis) {
            const lyrics = songData.lyrics || [];
            const sections = analysis.sections || {};

            // 清空现有和弦
            state.chordData = {};
            // 清空现有段落标记
            if (!state.song.sections) {
                state.song.sections = {};
            }

            // 将 AI 返回的段落信息写入歌词
            const lyricsText = lyrics.join('\n');
            for (const [sectionName, sectionData] of Object.entries(sections)) {
                if (!sectionData || !sectionData.lyrics) continue;
                
                // 查找该段落歌词在整体歌词中的位置
                const sectionLyrics = sectionData.lyrics;
                const startIndex = lyricsText.indexOf(sectionLyrics.substring(0, Math.min(20, sectionLyrics.length)));
                if (startIndex !== -1) {
                    // 计算对应的行号
                    let charCount = 0;
                    for (let i = 0; i < lyrics.length; i++) {
                        charCount += lyrics[i].length + 1; // +1 是换行符
                        if (charCount > startIndex) {
                            state.song.sections[i] = sectionName;
                            break;
                        }
                    }
                }
            }

            // 尝试匹配歌词与和弦
            lyrics.forEach((line, lineIndex) => {
                const lineChords = [];

                // 遍历所有段落，查找匹配的歌词
                for (const [sectionName, sectionData] of Object.entries(sections)) {
                    if (!sectionData || !sectionData.chords) continue;

                    // 检查歌词是否包含该段落的特征歌词
                    const sectionLyrics = sectionData.lyrics || '';
                    if (sectionLyrics && line.includes(sectionLyrics.substring(0, Math.min(10, sectionLyrics.length)))) {
                        // 找到了匹配的段落，使用该段落的前几个和弦
                        const chords = sectionData.chords;
                        const chordPerBeat = Math.ceil(chords.length / Math.max(1, line.length));
                        
                        for (let i = 0; i < chords.length; i++) {
                            const charIndex = Math.min(Math.floor(i / chordPerBeat), line.length - 1);
                            if (charIndex >= 0 && charIndex < line.length) {
                                lineChords.push({
                                    charIndex,
                                    chord: chords[i]
                                });
                            }
                        }
                        break;
                    }
                }

                // 如果没有匹配到，尝试使用通用和弦分配
                if (lineChords.length === 0) {
                    const keyChords = getChordsForKey(analysis.key || 'C');
                    const sectionIndex = getSectionIndex(lineIndex, lyrics.length);
                    const chordsForSection = keyChords[sectionIndex] || keyChords[1];

                    // 平均分配和弦到歌词字符
                    const chordCount = chordsForSection.length;
                    for (let i = 0; i < chordCount && i < line.length; i++) {
                        const charIndex = Math.floor((i / chordCount) * line.length);
                        lineChords.push({
                            charIndex,
                            chord: chordsForSection[i % chordCount]
                        });
                    }
                }

                // 写入和弦数据
                if (lineChords.length > 0) {
                    state.chordData[lineIndex] = {};
                    lineChords.forEach((item, idx) => {
                        const key = `${item.charIndex}_current`;
                        state.chordData[lineIndex][key] = {
                            chord: item.chord,
                            left: String(item.charIndex + 1),
                            right: '1',
                            position: 'current'
                        };
                    });
                }
            });

            // 更新 UI
            updateSongInfo();
            renderLyrics();
            updateSummary();
            updateSaveMenuText();
            saveToStorage();

            // 显示成功提示
            showToast(`🎉 AI 分析完成！检测到 ${Object.keys(sections).length} 个段落，已自动插入和弦`);
        }

        // 根据调式获取推荐和弦
        function getChordsForKey(key) {
            const keyMap = {
                'C': [['C', 'G', 'Am', 'F'], ['C', 'G', 'Am', 'F'], ['F', 'G', 'Em', 'Am', 'Dm', 'G', 'C'], ['F', 'G', 'Em', 'Am']],
                'G': [['G', 'D', 'Em', 'C'], ['G', 'D', 'Em', 'C'], ['C', 'D', 'Bm', 'Em', 'Am', 'D', 'G'], ['C', 'D', 'Bm', 'Em']],
                'D': [['D', 'A', 'Bm', 'G'], ['D', 'A', 'Bm', 'G'], ['G', 'A', 'F#m', 'Bm', 'Em', 'A', 'D'], ['G', 'A', 'F#m', 'Bm']],
                'A': [['A', 'E', 'F#m', 'D'], ['A', 'E', 'F#m', 'D'], ['D', 'E', 'C#m', 'F#m', 'Bm', 'E', 'A'], ['D', 'E', 'C#m', 'F#m']],
                'E': [['E', 'B', 'C#m', 'A'], ['E', 'B', 'C#m', 'A'], ['A', 'B', 'G#m', 'C#m', 'F#m', 'B', 'E'], ['A', 'B', 'G#m', 'C#m']],
                'F': [['F', 'C', 'Dm', 'Bb'], ['F', 'C', 'Dm', 'Bb'], ['Bb', 'C', 'Am', 'Dm', 'Gm', 'C', 'F'], ['Bb', 'C', 'Am', 'Dm']]
            };
            return keyMap[key] || keyMap['C'];
        }

        // 根据歌词位置判断段落
        function getSectionIndex(lineIndex, totalLines) {
            const ratio = lineIndex / Math.max(1, totalLines);
            if (ratio < 0.15) return 0; // 前奏
            if (ratio < 0.45) return 1; // 主歌
            if (ratio < 0.75) return 2; // 副歌
            if (ratio < 0.9) return 3;  // 桥段
            return 4; // 尾奏
        }

            searchResultsContent.innerHTML = songs.map(song => {

                const capoInfo = song.capo && song.capo > 0 ? `变调夹${song.capo}品` : '';
                const keyInfo = song.key ? `调:${song.key}` : '';
                const extraInfo = [capoInfo, keyInfo].filter(Boolean).join(' / ');
                
                return `
                    <div class="search-result-item">
                        <div class="search-result-info">
                            <div class="search-result-name">${escapeHtml(song.title)} ${hasChordsBadge}</div>
                            <div class="search-result-meta">
                                <span class="search-result-artist">${escapeHtml(song.artist)}</span>
                                ${song.album ? `<span style="margin-left: 8px;" class="search-result-album">专辑：${escapeHtml(song.album)}</span>` : ''}
                                ${extraInfo ? `<span style="margin-left: 8px;" class="search-result-album">${extraInfo}</span>` : ''}
                            </div>
                        </div>
                        <button class="btn btn-primary search-result-btn" 
                                data-song-id="${escapeHtml(song.id || '')}" 
                                data-song-name="${escapeHtml(song.title)}" 
                                data-song-artist="${escapeHtml(song.artist)}"
                                data-has-chords="${song.hasChords ? 'true' : 'false'}">选择</button>
                    </div>
                `;
            }).join('');
            
            // 存储第一个歌曲作为 AI 分析的候选（用于 AI 分析）
            if (songs.length > 0 && !songs[0].hasChords) {
                currentSelectedSong = {
                    title: songs[0].title,
                    artist: songs[0].artist,
                    lyrics: []  // 先存储基本信息，歌词会在选择歌曲时填充
                };
            }

            // 绑定选择按钮事件
            searchResultsContent.querySelectorAll('.search-result-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const songId = btn.dataset.songId;
                    const songName = btn.dataset.songName;
                    const songArtist = btn.dataset.songArtist;
                    const hasChords = btn.dataset.hasChords === 'true';
                    
                    // 存储当前选择的歌曲信息
                    currentSelectedSong = {
                        title: songName,
                        artist: songArtist,
                        lyrics: []
                    };
                    
                    await selectSong(songId, songName, songArtist, hasChords);
                });
            });
        }

        // 选择歌曲并获取歌词/和弦
        async function selectSong(songId, songName, songArtist, hasChords) {
            const searchResultsContent = document.getElementById('searchResultsContent');
            searchResultsContent.innerHTML = '<div class="search-result-loading">正在获取歌曲信息...</div>';

            try {
                // 如果有和弦数据，优先从和弦数据库获取
                if (hasChords) {
                    const chordsResponse = await fetch(`/api/chords/detail?title=${encodeURIComponent(songName)}`);
                    if (chordsResponse.ok) {
                        const chordsData = await chordsResponse.json();
                        
                        // 填充到 state.song（使用数据库中的歌词和和弦）
                        state.song = {
                            title: chordsData.title,
                            artist: chordsData.artist,
                            lyrics: chordsData.lyrics || [],
                            sections: chordsData.sections || {}
                        };
                        
                        // 将和弦数据填充到 state.chordData
                        state.chordData = {};
                        let lineIndex = 0;
                        Object.values(chordsData.sections || {}).forEach(chords => {
                            chords.forEach((chord, i) => {
                                if (!state.chordData[lineIndex]) {
                                    state.chordData[lineIndex] = {};
                                }
                                // 将和弦放在每行的第一个位置
                                state.chordData[lineIndex][`chord_${i}`] = {
                                    chord: chord,
                                    left: '1',
                                    right: '1',
                                    position: 'current'
                                };
                                if (i % 4 === 3) lineIndex++; // 每4个和弦换一行
                            });
                            lineIndex++;
                        });
                        
                        // 关闭弹窗并更新 UI
                        document.getElementById('searchResultsModal').classList.remove('visible');
                        updateSongInfo();
                        renderLyrics();
                        updateSummary();
                        updateSaveMenuText();
                        saveToStorage();
                        // 有和弦数据时不显示 AI 按钮
                        document.getElementById('aiChordAnalyzer').style.display = 'none';
                        return;
                    }
                }

                // 如果没有和弦或获取失败，尝试获取歌词
                const response = await fetch(`/api/music/lyric?id=${encodeURIComponent(songId)}`);
                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.error || '获取歌词失败');
                }

                const data = await response.json();
                
                // 更新当前选择的歌曲信息（包含歌词）
                currentSelectedSong = {
                    title: songName,
                    artist: songArtist,
                    lyrics: data.lyric ? parseLrcLyric(data.lyric) : []
                };

                // 如果没有歌词，抛出错误
                if (!data.lyric) {
                    throw new Error('该歌曲暂无歌词');
                }

                // 解析 LRC 格式歌词
                const lyrics = parseLrcLyric(data.lyric);

                // 填充到 state.song
                state.song = {
                    title: songName,
                    artist: songArtist,
                    lyrics: lyrics,
                    sections: {}
                };
                state.chordData = {};
                state.currentChartId = null;
                state.currentChartName = null;
                state.isDirty = false;

                // 关闭弹窗
                document.getElementById('searchResultsModal').classList.remove('visible');

                // 更新 UI
                updateSongInfo();
                renderLyrics();
                updateSummary();
                updateSaveMenuText();
                saveToStorage();
                
                // 显示 AI 和弦分析按钮（没有和弦数据时显示）
                document.getElementById('aiChordAnalyzer').style.display = 'block';
            } catch (error) {
                searchResultsContent.innerHTML = `<div class="search-result-empty">${escapeHtml(error.message)}</div>`;
            }
        }

        // Update song info display
        function updateSongInfo() {
            songInfo.style.display = 'block';
            const titleInput = document.getElementById('songTitleInput');
            const artistInput = document.getElementById('songArtistInput');
            const authorDisplay = document.getElementById('songAuthorDisplay');

            if (titleInput) {
                titleInput.value = state.song.title || '';
                titleInput.readOnly = state.isReadOnly;
            }
            if (artistInput) {
                artistInput.value = state.song.artist || '';
                artistInput.readOnly = state.isReadOnly;
            }
            // 只读模式下单独显示作者信息在歌手名下方
            if (authorDisplay) {
                if (state.isReadOnly && state.chartAuthor) {
                    authorDisplay.textContent = '作者: @' + state.chartAuthor;
                    authorDisplay.style.display = 'inline';
                } else {
                    authorDisplay.style.display = 'none';
                }
            }

            // 只读模式下隐藏保存按钮
            const saveBtn = document.getElementById('homeSaveBtn');
            if (saveBtn) {
                saveBtn.style.display = state.isReadOnly ? 'none' : 'inline-flex';
            }
        }

        // 解析 LRC 格式歌词，去除时间标签
        function parseLrcLyric(lrcText) {
            return lrcText.split('\n')
                .map(line => {
                    // 去除所有时间标签 [mm:ss.xx] 或 [mm:ss]
                    return line.replace(/\[\d{2}:\d{2}(\.\d{2,3})?\]/g, '').trim();
                })
                .filter(line => {
                    // 过滤空行和元数据行（如歌曲名、歌手名等）
                    if (line.length === 0) return false;
                    // 过滤纯元数据行（如 "晴天 - 呼杰伦" 这种标题行）
                    if (line.match(/^.{1,30}\s*-\s*.{1,30}$/) && !line.match(/[a-zA-Z\u4e00-\u9fa5]{3,}/)) {
                        // 如果是 "歌名 - 歌手" 格式且没有实际歌词内容，跳过
                        return false;
                    }
                    return true;
                });
        }

        // Fix overlapping chords - ensure ALL chords display completely without overlap
        function fixOverlappingChords() {
            const lines = lyricsContainer.querySelectorAll('.lyric-line');
            lines.forEach(lineEl => {
                const chars = lineEl.querySelectorAll('.lyric-char, .chord-slot');
                
                // Reset margins
                chars.forEach(charEl => {
                    charEl.style.marginLeft = '';
                    charEl.classList.remove('extra-space');
                });

                // Collect all chord elements with their positions
                const chordItems = [];
                chars.forEach((charEl, index) => {
                    const chordEl = charEl.querySelector('.char-chord, .slot-chord');
                    if (chordEl?.textContent?.trim()) {
                        chordItems.push({
                            index,
                            charEl,
                            chordEl,
                            originalLeft: charEl.getBoundingClientRect().left,
                            charCenter: charEl.getBoundingClientRect().left + charEl.getBoundingClientRect().width / 2,
                            chordWidth: chordEl.offsetWidth
                        });
                    }
                });

                // If no chords or only one chord, nothing to do
                if (chordItems.length <= 1) return;

                // Iterative overlap resolution
                let hasOverlap = true;
                let iterations = 0;
                const maxIterations = 10; // Prevent infinite loop

                while (hasOverlap && iterations < maxIterations) {
                    hasOverlap = false;
                    iterations++;

                    // Sort by current position
                    chordItems.sort((a, b) => a.charEl.getBoundingClientRect().left - b.charEl.getBoundingClientRect().left);

                    // Check all pairs (not just adjacent)
                    for (let i = 0; i < chordItems.length; i++) {
                        for (let j = i + 1; j < chordItems.length; j++) {
                            const item1 = chordItems[i];
                            const item2 = chordItems[j];

                            const rect1 = item1.charEl.getBoundingClientRect();
                            const rect2 = item2.charEl.getBoundingClientRect();

                            const chord1Right = rect1.left + rect1.width / 2 + item1.chordWidth / 2;
                            const chord2Left = rect2.left + rect2.width / 2 - item2.chordWidth / 2;

                            if (chord1Right > chord2Left) {
                                const overlap = chord1Right - chord2Left;
                                // Add margin to item2 to push it right with extra breathing room
                                const currentMargin = parseFloat(item2.charEl.style.marginLeft) || 0;
                                item2.charEl.style.marginLeft = `${currentMargin + overlap + 12}px`;
                                item2.charEl.classList.add('extra-space');
                                hasOverlap = true;
                            }
                        }
                    }
                }
            });
        }

        function renderLyrics() {
            // 确保至少有1行歌词
            while (state.song.lyrics.length < 1) {
                state.song.lyrics.push('');
            }
            
            const isReadOnly = state.isReadOnly;

            lyricsContainer.innerHTML = state.song.lyrics.map((line, lineIndex) => {
                const chars = line.split('').map((char, charIndex) => {
                    const preChord = getChord(lineIndex, charIndex, 'pre');
                    const curChord = getChord(lineIndex, charIndex, 'current');
                    const postChord = getChord(lineIndex, charIndex, 'post');

                    const preDisplay = formatChord(preChord);
                    const curDisplay = formatChord(curChord);
                    const postDisplay = formatChord(postChord);

                    const hasPre = preChord && preChord.chord;
                    const hasCur = curChord && curChord.chord;
                    const hasPost = postChord && postChord.chord;

                    // 只读模式下禁用点击
                    const clickAttrs = isReadOnly ? '' : `onclick="openChordPanel(${lineIndex}, ${charIndex}, 'current')"`;

                    return `
                        ${hasPre ? `
                        <span class="chord-slot ${hasPre ? 'has-chord' : ''}"
                              data-line="${lineIndex}"
                              data-char="${charIndex}"
                              data-pos="pre"
                              ${isReadOnly ? '' : 'onclick="openChordPanel(' + lineIndex + ', ' + charIndex + ', \'pre\')"'}>
                            <span class="slot-chord">${preDisplay}</span>
                            <span class="slot-text">·</span>
                        </span>` : ''}
                        <span class="lyric-char ${hasCur ? 'has-chord' : ''} ${isReadOnly ? 'readonly' : ''}"
                              data-line="${lineIndex}"
                              data-char="${charIndex}"
                              data-pos="current"
                              ${clickAttrs}>
                            <span class="char-chord">${curDisplay}</span>
                            <span class="char-text">${char === ' ' ? '&nbsp;' : char}</span>
                        </span>
                        ${hasPost ? `
                        <span class="chord-slot ${hasPost ? 'has-chord' : ''}"
                              data-line="${lineIndex}"
                              data-char="${charIndex}"
                              data-pos="post"
                              ${isReadOnly ? '' : 'onclick="openChordPanel(' + lineIndex + ', ' + charIndex + ', \'post\')"'}>
                            <span class="slot-chord">${postDisplay}</span>
                            <span class="slot-text">·</span>
                        </span>` : ''}
                    `;
                }).join('');

                const sectionLabel = state.song.sections && state.song.sections[lineIndex]
                    ? `<div class="line-section-label">${escapeHtml(state.song.sections[lineIndex])}</div>`
                    : '';

                return `
                    ${sectionLabel}
                    <div class="lyric-line ${isReadOnly ? 'is-readonly' : ''}" data-line="${lineIndex}">
                        <span class="line-number">${lineIndex + 1}</span>
                        <div class="line-content">${chars}</div>
                        ${isReadOnly ? '' : `
                        <div class="line-actions">
                            <button class="line-edit-btn" data-line="${lineIndex}" title="编辑歌词">✏️ 编辑</button>
                            <div class="section-selector">
                                <button class="section-btn" data-line="${lineIndex}">${state.song.sections && state.song.sections[lineIndex] ? escapeHtml(state.song.sections[lineIndex]) : '+ 段落'}</button>
                            </div>
                        </div>
                        `}
                    </div>
                `;
            }).join('');

            if (!isReadOnly) {
                // Bind click events for chord marking (character)
                lyricsContainer.querySelectorAll('.lyric-char').forEach(el => {
                    el.addEventListener('click', e => {
                        e.stopPropagation();
                        const line = parseInt(el.dataset.line);
                        const char = parseInt(el.dataset.char);
                        const pos = el.dataset.pos || 'current';
                        openChordPanel(line, char, pos, el);
                    });
                });

                // Bind click events for chord slots (pre/post)
                lyricsContainer.querySelectorAll('.chord-slot').forEach(el => {
                    el.addEventListener('click', e => {
                        e.stopPropagation();
                        const line = parseInt(el.dataset.line);
                        const char = parseInt(el.dataset.char);
                        const pos = el.dataset.pos;
                        openChordPanel(line, char, pos, el);
                    });
                });

                // Bind section selector
                lyricsContainer.querySelectorAll('.section-btn').forEach(btn => {
                    btn.addEventListener('click', e => {
                        e.stopPropagation();
                        const lineIndex = parseInt(btn.dataset.line);
                        showSectionSelector(btn, lineIndex);
                    });
                });
            }

            // Edit lyric line
            function editLyricLine(lineIndex, btn) {
                // Close any open section dropdown first
                document.querySelectorAll('.section-dropdown').forEach(el => el.remove());
                document.querySelectorAll('.line-actions.section-dropdown-active').forEach(el => {
                    el.classList.remove('section-dropdown-active');
                });
                document.querySelectorAll('.lyric-line.line-with-active-dropdown').forEach(el => {
                    el.classList.remove('line-with-active-dropdown');
                });
                if (sectionDropdownOutsideHandler) {
                    document.removeEventListener('mousedown', sectionDropdownOutsideHandler);
                    sectionDropdownOutsideHandler = null;
                }

                const lineEl = btn.closest('.lyric-line');
                const lineContent = lineEl.querySelector('.line-content');
                const currentText = state.song.lyrics[lineIndex] || '';

                // Hide edit button only (keep section-selector visible for other rows)
                lineEl.querySelector('.line-edit-btn').style.visibility = 'hidden';
                // Also hide section-selector for this row only
                const sectionSel = lineEl.querySelector('.section-selector');
                if (sectionSel) sectionSel.style.visibility = 'hidden';

                // Create edit container with textarea and delete button
                const editContainer = document.createElement('div');
                editContainer.className = 'lyric-edit-container';

                // Create textarea for multi-line paste support
                const input = document.createElement('textarea');
                input.className = 'lyric-edit-input';
                input.value = currentText;
                input.rows = 2;
                input.style.flex = '1';

                // Create delete button
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'line-delete-inline-btn';
                deleteBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>';
                deleteBtn.title = '删除此行';
                deleteBtn.type = 'button'; // 防止表单提交

                editContainer.appendChild(input);
                editContainer.appendChild(deleteBtn);

                // Replace line content with edit container
                lineContent.innerHTML = '';
                lineContent.appendChild(editContainer);
                input.focus();
                input.select();

                const save = () => {
                    const value = input.value;
                    const lines = value.split('\n').filter(line => line.trim());
                    
                    if (lines.length > 1) {
                        // 粘贴了多行，替换当前行并插入新增行
                        state.song.lyrics[lineIndex] = lines[0];
                        // Shift sections for lines after lineIndex (new lines are inserted without sections)
                        if (state.song.sections) {
                            const shiftedSections = {};
                            for (const key in state.song.sections) {
                                const idx = parseInt(key);
                                if (idx > lineIndex) {
                                    shiftedSections[idx + (lines.length - 1)] = state.song.sections[key];
                                } else {
                                    shiftedSections[idx] = state.song.sections[key];
                                }
                            }
                            state.song.sections = shiftedSections;
                        }
                        // 在当前行后插入剩余行
                        for (let i = 1; i < lines.length; i++) {
                            state.song.lyrics.splice(lineIndex + i, 0, lines[i]);
                        }
                    } else {
                        state.song.lyrics[lineIndex] = value;
                    }
                    
                    markDirty();
                    saveToStorage();
                    renderLyrics();
                };

                const cancel = () => {
                    renderLyrics();
                };

                let isDeleting = false;

                const performDelete = () => {
                    isDeleting = true;
                    // 直接删除，用 toast 提示
                    state.song.lyrics.splice(lineIndex, 1);

                    // Rebuild chordData: shift all line indices above the deleted line down by 1
                    const newChordData = {};
                    for (const key in state.chordData) {
                        const idx = parseInt(key);
                        if (idx === lineIndex) {
                            continue;
                        } else if (idx > lineIndex) {
                            newChordData[idx - 1] = state.chordData[key];
                        } else {
                            newChordData[idx] = state.chordData[key];
                        }
                    }
                    state.chordData = newChordData;

                    // Rebuild sections: shift all line indices above the deleted line down by 1
                    if (state.song.sections) {
                        const newSections = {};
                        for (const key in state.song.sections) {
                            const idx = parseInt(key);
                            if (idx === lineIndex) {
                                continue;
                            } else if (idx > lineIndex) {
                                newSections[idx - 1] = state.song.sections[key];
                            } else {
                                newSections[idx] = state.song.sections[key];
                            }
                        }
                        state.song.sections = newSections;
                    }

                    markDirty();
                    saveToStorage();
                    renderLyrics();
                    updateSummary();
                    showToast('歌词已删除');
                };

                deleteBtn.addEventListener('mousedown', (e) => {
                    e.preventDefault(); // 阻止焦点转移
                });

                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    performDelete();
                });

                input.addEventListener('keydown', e => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        save();
                    } else if (e.key === 'Escape') {
                        e.preventDefault();
                        cancel();
                    }
                });

                input.addEventListener('blur', () => {
                    // 如果正在删除，不执行保存
                    if (isDeleting) return;
                    // 延迟保存，等待可能的其他交互
                    setTimeout(() => {
                        if (!isDeleting) {
                            save();
                        }
                    }, 150);
                });
            }

            // Bind line edit button
            if (!isReadOnly) {
                lyricsContainer.querySelectorAll('.line-edit-btn').forEach(btn => {
                    btn.addEventListener('click', e => {
                        e.stopPropagation();
                        const lineIndex = parseInt(btn.dataset.line);
                        editLyricLine(lineIndex, btn);
                    });
                });
            }

            // Fix overlapping chords after render
            setTimeout(fixOverlappingChords, 0);
        }

        // Get chord data (supports both old numeric keys and new composite keys)
        function getChord(lineIndex, charIndex, position) {
            const lineData = state.chordData[lineIndex];
            if (!lineData) return null;
            // New composite key format: "2_current"
            const newKey = `${charIndex}_${position}`;
            if (lineData[newKey]) return lineData[newKey];
            // Legacy format: numeric key (for old saved data)
            if (position === 'current' && lineData[charIndex] && !String(charIndex).includes('_')) {
                return lineData[charIndex];
            }
            return null;
        }

        // Format chord for display
        function formatChord(chord) {
            if (!chord || !chord.chord) return '';

            const offset = state.keyOffset || 0;
            const displayChord = transposeChordName(chord.chord, offset);

            if (state.displayMode === 'tab' && chord.left && chord.right) {
                const displayLeft = transposeTabNumber(chord.left, offset);
                const displayRight = transposeTabNumber(chord.right, offset);
                return `<span class="fc-chord">${displayChord}</span><span class="fc-tab">${displayLeft}(${displayRight})</span>`;
            }
            return `<span class="fc-chord">${displayChord}</span>`;
        }

        // Open chord panel
        function openChordPanel(lineIndex, charIndex, position, targetEl) {
            position = position || 'current';
            state.selectedChar = { line: lineIndex, char: charIndex, pos: position };

            // Close any open section selector dropdown
            document.querySelectorAll('.section-dropdown').forEach(el => el.remove());
            document.querySelectorAll('.line-actions.section-dropdown-active').forEach(el => {
                el.classList.remove('section-dropdown-active');
            });
            document.querySelectorAll('.lyric-line.line-with-active-dropdown').forEach(el => {
                el.classList.remove('line-with-active-dropdown');
            });
            if (sectionDropdownOutsideHandler) {
                document.removeEventListener('mousedown', sectionDropdownOutsideHandler);
                sectionDropdownOutsideHandler = null;
            }

            // Reset chord builder first
            resetChordBuilder();

            // Load existing chord data and try to restore builder state
            const chord = getChord(lineIndex, charIndex, position);
            if (chord && chord.chord) {
                // 解析和弦名称恢复构建器按钮选择状态
                parseChordToBuilder(chord.chord, chord.left, chord.right);

                // 加载已保存的弹唱标记到输入框
                if (chord.left && chord.left !== '-') {
                    document.getElementById('tabLeftInput').value = chord.left;
                }
                if (chord.right && chord.right !== '-') {
                    document.getElementById('tabRightInput').value = chord.right;
                }
            }

            // Enable/disable delete button based on whether chord exists
            const deleteBtn = document.getElementById('chordDelete');
            if (deleteBtn) {
                if (chord && chord.chord) {
                    deleteBtn.disabled = false;
                    deleteBtn.style.opacity = '1';
                    deleteBtn.style.cursor = 'pointer';
                } else {
                    deleteBtn.disabled = true;
                    deleteBtn.style.opacity = '0.5';
                    deleteBtn.style.cursor = 'not-allowed';
                }
            }

            // 存储目标元素用于滚动时定位面板
            chordPanelTargetEl = targetEl;

            // 首次定位并显示
            chordPanel.classList.add('visible');
            repositionChordPanel();

            // 注册滚动和缩放监听（整个文档的滚动事件）
            window.addEventListener('scroll', repositionChordPanel, true);
            window.addEventListener('resize', repositionChordPanel);

            // Update position selector
            document.querySelectorAll('.pos-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.pos === position);
            });

            updateChordPreview();
        }

        // 解析和弦名称到构建器状态
        function parseChordToBuilder(chordName, left, right) {
            // 简单解析：提取根音、升降号、性质
            const match = chordName.match(/^([CDEFGAB])(#|b)?(.*)$/);
            if (!match) return;

            const root = match[1];
            const accidental = match[2] ? (match[2] === '#' ? 'sharp' : 'flat') : 'none';
            const suffix = match[3] || '';

            // 设置根音
            chordBuilderState.root = root;
            document.querySelectorAll('#rootGroup .chord-btn').forEach(b => {
                b.classList.toggle('selected', b.dataset.root === root);
            });

            // 设置升降号
            chordBuilderState.accidental = accidental;
            document.querySelectorAll('#accidentalGroup .chord-btn').forEach(b => {
                b.classList.toggle('selected', b.dataset.accidental === accidental);
            });

            // 解析性质
            let quality = 'major';
            if (suffix.includes('m7')) quality = 'm7';
            else if (suffix.includes('maj7')) quality = 'maj7';
            else if (suffix.includes('dim7')) quality = 'dim7';
            else if (suffix.includes('dim')) quality = 'dim';
            else if (suffix.includes('aug')) quality = 'aug';
            else if (suffix.includes('sus2')) quality = 'sus2';
            else if (suffix.includes('sus4')) quality = 'sus4';
            else if (suffix.includes('m')) quality = 'minor';
            else if (suffix.includes('7')) quality = '7';

            chordBuilderState.quality = quality;
            document.querySelectorAll('#qualityGroup .chord-btn').forEach(b => {
                b.classList.toggle('selected', b.dataset.quality === quality);
            });

            // 解析扩展音
            const extensions = [];
            if (suffix.includes('add9')) extensions.push('add9');
            if (suffix.includes('add2')) extensions.push('add2');
            if (suffix.includes('9') && !suffix.includes('add9')) extensions.push('9');
            if (suffix.includes('11')) extensions.push('11');
            if (suffix.includes('13')) extensions.push('13');

            chordBuilderState.extensions = extensions;
            document.querySelectorAll('#extensionGroup .chord-btn').forEach(b => {
                b.classList.toggle('selected', extensions.includes(b.dataset.ext));
            });

            // 解析转位
            const slashMatch = chordName.match(/\/([CDEFGAB])$/);
            if (slashMatch) {
                chordBuilderState.slash = slashMatch[1];
                updateSlashOptions();
                setTimeout(() => {
                    document.querySelectorAll('#slashGroup .slash-btn').forEach(b => {
                        b.classList.toggle('selected', b.dataset.slash === slashMatch[1]);
                    });
                }, 0);
            }
        }

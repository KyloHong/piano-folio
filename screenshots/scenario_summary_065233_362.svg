    <text x="100" y="160" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e8e8e8">场景</text>
    <text x="360" y="160" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e8e8e8">搜索栏可见</text>
    <text x="580" y="160" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e8e8e8">歌词可编辑</text>
    <text x="760" y="160" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e8e8e8">核心 state</text>

    <!-- 分隔线 -->
    <line x1="60" y1="180" x2="940" y2="180" stroke="#e94560" stroke-width="1" opacity="0.5"/>

    
        <rect x="80" y="200" width="840" height="120" rx="8" fill="#1a1a3a" opacity="0.8"/>

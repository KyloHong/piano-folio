        <circle cx="400" cy="540" r="22" fill="#00d4aa"/>
        <text x="392" y="545" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white">✓</text>
        <text x="360" y="585" font-family="Arial, sans-serif" font-size="12" fill="#00d4aa" text-anchor="middle">可见</text>
        <circle cx="620" cy="540" r="22" fill="#00d4aa"/>
        <text x="612" y="545" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white">✓</text>
        <text x="580" y="585" font-family="Arial, sans-serif" font-size="12" fill="#00d4aa" text-anchor="middle">可编辑</text>
        <text x="760" y="530" font-family="monospace" font-size="12" fill="#e8e8e8">isReadOnly=false</text>
        <text x="760" y="555" font-family="monospace" font-size="12" fill="#e8e8e8">isNewChart=true</text>
      

    <!-- 底部说明 -->
    <text x="60" y="750" font-family="Arial, sans-serif" font-size="13" fill="#a0a0b0">核心控制逻辑：</text>
    <text x="160" y="750" font-family="monospace" font-size="13" fill="#e8e8e8">state.isNewChart  →  #homeSearchSection.readonly-hidden { display: none; }</text>
    <text x="160" y="775" font-family="monospace" font-size="13" fill="#e8e8e8">state.isReadOnly  →  .lyric-line.is-readonly { pointer-events: none; } + onclick 事件条件渲染</text>

  </svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800">
    <defs>
      <linearGradient id="sumGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#0a0a1a"/>
        <stop offset="100%" stop-color="#16213e"/>
      </linearGradient>
    </defs>
    <rect width="1000" height="800" fill="url(#sumGrad)"/>
    <text x="60" y="60" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#e8e8e8">搜索栏行为总结</text>
    <text x="60" y="90" font-family="Arial, sans-serif" font-size="16" fill="#a0a0b0">Search Bar Behavior Summary · 三种场景对比</text>

    <!-- 表格 -->
    <rect x="60" y="120" width="880" height="620" rx="12" fill="#16213e" stroke="#e94560" stroke-width="2" opacity="0.9"/>

    <!-- 表头 -->

        <circle cx="620" cy="400" r="22" fill="#00d4aa"/>
        <text x="612" y="405" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white">✓</text>
        <text x="580" y="445" font-family="Arial, sans-serif" font-size="12" fill="#00d4aa" text-anchor="middle">可编辑</text>
        <text x="760" y="390" font-family="monospace" font-size="12" fill="#e8e8e8">isReadOnly=false</text>
        <text x="760" y="415" font-family="monospace" font-size="12" fill="#e8e8e8">isNewChart=false</text>
      
        <rect x="80" y="480" width="840" height="120" rx="8" fill="#1a1a3a" opacity="0.8"/>
